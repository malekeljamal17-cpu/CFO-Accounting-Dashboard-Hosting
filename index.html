function openRateCardModal(categoryKey) {
  const cat = state.settings.serviceCategories[categoryKey];
  if (!cat) return;
  const rc = state.settings.rateCard;
  document.getElementById("modalRoot").innerHTML = `\n    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">\n      <div class="modal" style="width:480px;">\n        <div class="modal-header"><h3>Rate Card — ${esc(cat.label)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>\n        <input type="hidden" id="f-category-key" value="${categoryKey}" />\n        <table style="width:100%;border-collapse:collapse;font-size:12.5px;">\n          <thead><tr><th style="text-align:left;padding:6px;">Tier</th><th style="text-align:left;padding:6px;">Lebanon (USD)</th><th style="text-align:left;padding:6px;">Qatar (QAR)</th></tr></thead>\n          <tbody>${Object.entries(TIERS).map(([tierKey, tierLabel]) => `\n            <tr>\n              <td style="padding:6px;">${tierLabel}</td>\n              <td style="padding:6px;"><input type="number" min="0" step="1" id="f-rate-lebanon-${tierKey}" value="${rc.lebanon[categoryKey]?.[tierKey] ?? 0}" style="width:100%;" /></td>\n              <td style="padding:6px;"><input type="number" min="0" step="1" id="f-rate-qatar-${tierKey}" value="${rc.qatar[categoryKey]?.[tierKey] ?? 0}" style="width:100%;" /></td>\n            </tr>`).join("")}</tbody>\n        </table>\n        <button class="btn btn-navy" style="width:100%;margin-top:14px;" onclick="submitRateCardModal()">Save Rates</button>\n      </div>\n    </div>`;
}

async function submitRateCardModal() {
  const categoryKey = document.getElementById("f-category-key").value;
  const rc = state.settings.rateCard;
  if (!rc.lebanon[categoryKey]) rc.lebanon[categoryKey] = {};
  if (!rc.qatar[categoryKey]) rc.qatar[categoryKey] = {};
  for (const tierKey of Object.keys(TIERS)) {
    const lebVal = Number(document.getElementById(`f-rate-lebanon-${tierKey}`).value);
    const qatVal = Number(document.getElementById(`f-rate-qatar-${tierKey}`).value);
    rc.lebanon[categoryKey][tierKey] = Number.isFinite(lebVal) && lebVal >= 0 ? lebVal : 0;
    rc.qatar[categoryKey][tierKey] = Number.isFinite(qatVal) && qatVal >= 0 ? qatVal : 0;
  }
  logActivity(`Rate card updated for "${categoryLabel(categoryKey)}"`);
  await saveState();
  closeModal();
  render();
  toast("Rates updated");
}

function renderZakat() {
  const zakatDue = state.zakatCalc.assets * state.zakatCalc.rate;
  const assetsUSD = usdEquivalent(state.zakatCalc.assets, state.zakatCalc.currency);
  const belowNisab = state.zakatCalc.nisabUSD > 0 && assetsUSD < state.zakatCalc.nisabUSD;
  const disbursedTotalUSD = state.zakatDisbursements.reduce((s, d) => s + usdEquivalent(d.amount, d.currency), 0);
  const disbursedTotal = usdToCurrency(disbursedTotalUSD, state.zakatCalc.currency);
  const byTierUSD = {
    family: 0,
    friends_neighbors: 0,
    institutional: 0
  };
  for (const d of state.zakatDisbursements) byTierUSD[d.tier] += usdEquivalent(d.amount, d.currency);
  const byTier = {};
  for (const k of Object.keys(byTierUSD)) byTier[k] = usdToCurrency(byTierUSD[k], state.zakatCalc.currency);
  const remaining = zakatDue - disbursedTotal;
  const tierMeta = [ {
    key: "family",
    label: "Tier One — Family",
    color: NAVY
  }, {
    key: "friends_neighbors",
    label: "Tier Two — Friends & Neighbors",
    color: NAVY_LIGHT
  }, {
    key: "institutional",
    label: "Tier Three — Institutional",
    color: GOLD
  } ];
  return `\n    <div class="view-header"><div><h2>Zakat Ledger</h2><p>Annual calculation and three-tier waterfall — Family Constitution, Article VIII</p></div>\n      <div style="display:flex;gap:8px;"><button class="btn btn-gold" onclick="openZakatCalcModal()">Set Assets / Rate</button><button class="btn btn-gold" onclick="openZakatModal()">+ Record Disbursement</button></div></div>\n    <div class="stat-grid">\n      <div class="stat-card"><div class="label">Zakatable Assets</div><div class="value">${fmt(state.zakatCalc.assets, state.zakatCalc.currency)}</div></div>\n      <div class="stat-card"><div class="label">Zakat Due (${(state.zakatCalc.rate * 100).toFixed(2)}%)</div><div class="value">${fmt(zakatDue, state.zakatCalc.currency)}</div>${belowNisab ? '<div class="sub" style="color:#B23B3B;">Below Nisab — not obligatory</div>' : ""}</div>\n      <div class="stat-card"><div class="label">Disbursed to Date</div><div class="value">${fmt(disbursedTotal, state.zakatCalc.currency)}</div></div>\n      <div class="stat-card"><div class="label">Remaining</div><div class="value" style="color:${remaining > 0 ? "#B23B3B" : "#2A6F3F"};">${fmt(remaining, state.zakatCalc.currency)}</div></div>\n    </div>\n    ${belowNisab ? `<div class="note-box" style="margin-top:-8px;">Zakatable Assets (≈ ${fmt(assetsUSD, "USD")}) are below your Nisab threshold (${fmt(state.zakatCalc.nisabUSD, "USD")}) — per Article VIII, Zakat is not religiously obligatory at this asset level. The "Zakat Due" figure above is still shown for reference (Assets × Rate), but nothing requires it to be paid.</div>` : ""}\n    <div class="note-box" style="margin-top:-8px;">"Disbursed to Date" and "Remaining" consolidate USD and QAR disbursements into one figure — each is converted at the QAR/USD peg (${state.settings.qarPerUsd}) before totaling, so a disbursement made in a different currency than your Zakat base still counts correctly rather than being added as a raw, unconverted number.</div>\n    <div class="card">\n      <h3>Distribution Waterfall</h3>\n      <p style="font-size:12.5px;color:#6B7280;margin:0 0 16px;">Tier One (family) → Tier Two (friends/neighbors) → Tier Three (institutional), per Section 8.2.</p>\n      ${tierMeta.map(t => {
    const val = byTier[t.key] || 0;
    const pct = zakatDue > 0 ? Math.min(100, val / zakatDue * 100) : 0;
    return `\n        <div class="waterfall-row">\n          <div class="waterfall-label"><span>${t.label}</span><span style="font-weight:600;">${fmt(val, state.zakatCalc.currency)}</span></div>\n          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${t.color};"></div></div>\n        </div>`;
  }).join("")}\n    </div>\n    <div class="card">\n      <h3>Disbursement Records</h3>\n      ${state.zakatDisbursements.length ? `<table>\n        <thead><tr><th>Ref #</th><th>Date</th><th>Tier</th><th>Recipient</th><th>Amount</th><th>Consent</th><th></th></tr></thead>\n        <tbody>${state.zakatDisbursements.map(d => {
    const requiresConsent = requiresJointConsent(d.amount, d.currency);

function computeBalanceSheet() {
  const manualAssetsUSD = state.balanceSheetAccounts.filter(a => a.type === "asset").reduce((s, a) => s + usdEquivalent(a.balance, a.currency), 0);
  const manualLiabilitiesUSD = state.balanceSheetAccounts.filter(a => a.type === "liability").reduce((s, a) => s + usdEquivalent(a.balance, a.currency), 0);
  const manualEquityUSD = state.balanceSheetAccounts.filter(a => a.type === "equity").reduce((s, a) => s + usdEquivalent(a.balance, a.currency), 0);
  const ledgerCashUSD = ledgerAccountBalance("cash");
  const accountsReceivableUSD = ledgerAccountBalance("accounts_receivable");
  const ledgerOtherAssetsUSD = ledgerAccountBalance("other_assets");
  const ledgerVatReceivableUSD = ledgerAccountBalance("vat_receivable");
  const ledgerDeferredRevenueUSD = -ledgerAccountBalance("deferred_revenue");
  const ledgerVatPayableUSD = -ledgerAccountBalance("vat_payable");
  const ledgerZakatPayableUSD = -ledgerAccountBalance("zakat_payable");
  const ledgerOtherLiabilitiesUSD = -ledgerAccountBalance("other_liabilities");
  const ledgerOwnersCapitalUSD = -ledgerAccountBalance("owners_capital");
  const zakatDistributionsUSD = ledgerAccountBalance("zakat_distributions");
  const revenueUSD = -ledgerAccountBalance("revenue");
  const expenseUSD = ledgerAccountBalance("expense");
  const badDebtExpenseUSD = ledgerAccountBalance("bad_debt_expense");
  const retainedEarningsUSD = revenueUSD - expenseUSD - badDebtExpenseUSD;
  const totalAssetsUSD = manualAssetsUSD + ledgerCashUSD + accountsReceivableUSD + ledgerOtherAssetsUSD + ledgerVatReceivableUSD;
  const totalLiabilitiesUSD = manualLiabilitiesUSD + ledgerDeferredRevenueUSD + ledgerVatPayableUSD + ledgerZakatPayableUSD + ledgerOtherLiabilitiesUSD;
  const totalEquityUSD = manualEquityUSD + ledgerOwnersCapitalUSD - zakatDistributionsUSD + retainedEarningsUSD;
  return {
    manualAssetsUSD: manualAssetsUSD,
    manualLiabilitiesUSD: manualLiabilitiesUSD,
    manualEquityUSD: manualEquityUSD,
    accountsReceivableUSD: accountsReceivableUSD,
    retainedEarningsUSD: retainedEarningsUSD,
    ledgerCashUSD: ledgerCashUSD,
    ledgerOtherAssetsUSD: ledgerOtherAssetsUSD,
    ledgerVatReceivableUSD: ledgerVatReceivableUSD,
    ledgerDeferredRevenueUSD: ledgerDeferredRevenueUSD,
    ledgerVatPayableUSD: ledgerVatPayableUSD,
    ledgerZakatPayableUSD: ledgerZakatPayableUSD,
    ledgerOtherLiabilitiesUSD: ledgerOtherLiabilitiesUSD,
    ledgerOwnersCapitalUSD: ledgerOwnersCapitalUSD,
    zakatDistributionsUSD: zakatDistributionsUSD,
    badDebtExpenseUSD: badDebtExpenseUSD,
    totalAssetsUSD: totalAssetsUSD,
    totalLiabilitiesUSD: totalLiabilitiesUSD,
    totalEquityUSD: totalEquityUSD,
    differenceUSD: totalAssetsUSD - (totalLiabilitiesUSD + totalEquityUSD)
  };
}

function computeTrialBalance() {
  const rows = Object.entries(CHART_OF_ACCOUNTS).map(([key, meta]) => {
    let debit = 0, credit = 0;
    for (const e of state.journalEntries) for (const l of e.lines) if (l.account === key) {
      debit += l.debit || 0;
      credit += l.credit || 0;
    }
    const net = debit - credit;
    return {
      account: key,
      label: meta.label,
      type: meta.type,
      debitBalance: net > 0 ? net : 0,
      creditBalance: net < 0 ? -net : 0
    };
  }).filter(r => r.debitBalance > .005 || r.creditBalance > .005);
  const totalDebit = rows.reduce((s, r) => s + r.debitBalance, 0);
  const totalCredit = rows.reduce((s, r) => s + r.creditBalance, 0);
  return {
    rows: rows,
    totalDebit: totalDebit,
    totalCredit: totalCredit
  };
}

function ledgerCashEntries() {
  const rows = [];
  for (const e of state.journalEntries) {
    for (const l of e.lines) {
      if (l.account === "cash") {
        rows.push({
          entryId: e.id,
          date: e.date,
          description: e.description,
          amountUSD: (l.debit || 0) - (l.credit || 0)
        });
        break;
      }
    }
  }
  return rows.sort((a, b) => new Date(a.date) - new Date(b.date));
}

function matchedStatementLineForEntry(entryId) {
  return state.bankStatementLines.find(l => l.matchedEntryId === entryId);
}

function isEntryReconciled(entryId) {
  return !!matchedStatementLineForEntry(entryId);
}

function computeReconciliationSummary() {
  const cashEntries = ledgerCashEntries();
  const bookBalanceUSD = ledgerAccountBalance("cash");
  const unmatchedEntries = cashEntries.filter(e => !isEntryReconciled(e.entryId));
  const unmatchedLines = state.bankStatementLines.filter(l => !l.matchedEntryId);
  const outstandingUSD = unmatchedEntries.reduce((s, e) => s + e.amountUSD, 0);
  const unrecordedUSD = unmatchedLines.reduce((s, l) => s + l.amount, 0);
  const projectedBookBalanceUSD = state.reconciliation.statementEndingBalanceUSD + outstandingUSD - unrecordedUSD;
  const differenceUSD = bookBalanceUSD - projectedBookBalanceUSD;
  return {
    cashEntries: cashEntries,
    bookBalanceUSD: bookBalanceUSD,
    unmatchedEntries: unmatchedEntries,
    unmatchedLines: unmatchedLines,
    outstandingUSD: outstandingUSD,
    unrecordedUSD: unrecordedUSD,
    projectedBookBalanceUSD: projectedBookBalanceUSD,
    differenceUSD: differenceUSD
  };
}

async function updateReconciliationBalance(amount, date) {

  render();
}

function handleBankStatementCSVSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader;
  reader.onload = () => {
    let rows;
    try {
      rows = parseCSV(reader.result);
    } catch (e) {
      toast("Could not parse that CSV file.", true);
      event.target.value = "";
      return;
    }
    if (rows.length < 2) {
      toast("CSV needs a header row plus at least one data row.", true);
      event.target.value = "";
      return;
    }
    const header = rows[0].map(h => h.trim().toLowerCase());
    const dateIdx = header.indexOf("date");
    const descIdx = header.findIndex(h => h === "description" || h === "memo" || h === "narrative");
    const amountIdx = header.indexOf("amount");
    const debitIdx = header.indexOf("debit");
    const creditIdx = header.indexOf("credit");
    if (dateIdx === -1) {
      toast('CSV must have a "date" column.', true);
      event.target.value = "";
      return;
    }
    if (amountIdx === -1 && debitIdx === -1 && creditIdx === -1) {
      toast('CSV must have an "amount" column, or "debit"/"credit" columns.', true);
      event.target.value = "";
      return;
    }
    const candidates = [];
    let skippedCount = 0;
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const rawDate = (r[dateIdx] || "").trim();
      if (!rawDate) {
        skippedCount++;
        continue;
      }
      let date = rawDate;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        const parsedDate = new Date(rawDate);
        if (isNaN(parsedDate)) {
          skippedCount++;
          continue;
        }
        date = parsedDate.toISOString().slice(0, 10);
      }
      let amount;
      if (amountIdx > -1) amount = Number(String(r[amountIdx] || "0").replace(/[,$]/g, "")); else amount = Number(String(r[creditIdx] || "0").replace(/[,$]/g, "")) - Number(String(r[debitIdx] || "0").replace(/[,$]/g, ""));
      if (!isFinite(amount)) {
        skippedCount++;
        continue;
      }
      const description = descIdx > -1 ? (r[descIdx] || "").trim() : "";
      candidates.push({
        date: date,
        description: description,
        amount: round2(amount)
      });
    }
    window.__pendingStatementImport = candidates;
    openBankStatementCSVPreviewModal(candidates, skippedCount);
    event.target.value = "";
  };
  reader.onerror = () => toast("Could not read that file.", true);
  reader.readAsText(file);
}

async function deleteBankStatementLine(id) {

async function clearBankStatementLines() {
  if (!state.bankStatementLines.length) return;
  if (!confirm(`Delete all ${state.bankStatementLines.length} imported statement line(s) and their matches? This cannot be undone.`)) return;
  state.bankStatementLines = [];
  if (SUPABASE_ENABLED) {

let reconcileSelectedLineId = null;

function selectReconcileEntry(entryId) {

function selectReconcileLine(lineId) {

async function matchSelectedReconciliation() {
  if (!reconcileSelectedEntryId || !reconcileSelectedLineId) return;
  const line = state.bankStatementLines.find(l => l.id === reconcileSelectedLineId);
  if (!line) return;
  line.matchedEntryId = reconcileSelectedEntryId;
  reconcileSelectedEntryId = null;
  reconcileSelectedLineId = null;
  await saveState();
  render();
}

async function unmatchStatementLine(lineId) {
  const line = state.bankStatementLines.find(l => l.id === lineId);
  if (!line) return;
  line.matchedEntryId = null;
  await saveState();
  render();
}

async function autoMatchBankStatement() {
  const cashEntries = ledgerCashEntries();
  let matchedCount = 0;
  for (const line of state.bankStatementLines) {
    if (line.matchedEntryId) continue;
    const candidates = cashEntries.filter(e => !isEntryReconciled(e.entryId) && e.date === line.date && Math.abs(e.amountUSD - line.amount) < .005);
    if (candidates.length === 1) {
      line.matchedEntryId = candidates[0].entryId;
      matchedCount++;
    }
  }
  if (matchedCount) await saveState();
  render();
  toast(matchedCount ? `Auto-matched ${matchedCount} line(s) by exact date + amount` : "No confident exact matches found — match the rest manually below");
}

function computeProfitLoss(startDate, endDate) {
  const inRange = d => (!startDate || d >= startDate) && (!endDate || d <= endDate);
  const revByCategory = {};
  let totalRevenueUSD = 0, charitableObligationUSD = 0;
  for (const inv of state.invoices) {
    if (inv.status === "cancelled") continue;
    if (!inRange(inv.issueDate)) continue;
    const netUSD = usdEquivalent(inv.amount - (inv.vatAmount || 0), inv.currency);
    totalRevenueUSD += netUSD;
    const label = categoryLabel(inv.category) || inv.category;
    revByCategory[label] = (revByCategory[label] || 0) + netUSD;
  }
  for (const p of state.payments) {
    if (!p.isLateCharge) continue;
    if (!inRange(p.date)) continue;
    const incomeUSD = usdEquivalent(p.actualCost || 0, p.currency);
    totalRevenueUSD += incomeUSD;
    revByCategory["Late Charges (Cost Recovery)"] = (revByCategory["Late Charges (Cost Recovery)"] || 0) + incomeUSD;
    charitableObligationUSD += usdEquivalent(p.charitablePortion || 0, p.currency);
  }
  const expByCategory = {};
  let totalExpensesUSD = 0;
  for (const e of state.expenses) {
    if (!inRange(e.date)) continue;
    const amountUSD = usdEquivalent(e.amount - (e.vatAmount || 0), e.currency);
    totalExpensesUSD += amountUSD;
    expByCategory[e.category] = (expByCategory[e.category] || 0) + amountUSD;
  }
  let badDebtExpenseUSD = 0;
  for (const je of state.journalEntries) {
    if (je.sourceType !== "invoice-cancel" || !inRange(je.date)) continue;
    for (const l of je.lines) if (l.account === "bad_debt_expense") badDebtExpenseUSD += l.debit || 0;
  }
  if (badDebtExpenseUSD > .005) {
    expByCategory["Bad Debt (Uncollectible Invoices)"] = (expByCategory["Bad Debt (Uncollectible Invoices)"] || 0) + badDebtExpenseUSD;
    totalExpensesUSD += badDebtExpenseUSD;
  }
  return {
    revByCategory: revByCategory,
    totalRevenueUSD: totalRevenueUSD,
    expByCategory: expByCategory,
    totalExpensesUSD: totalExpensesUSD,
    netIncomeUSD: totalRevenueUSD - totalExpensesUSD,
    charitableObligationUSD: charitableObligationUSD
  };
}

function computeVatReport(startDate, endDate) {
  const inRange = d => (!startDate || d >= startDate) && (!endDate || d <= endDate);
  let outputVatUSD = 0, inputVatUSD = 0;
  for (const je of state.journalEntries) {
    if (!inRange(je.date)) continue;
    for (const l of je.lines) {
      if (l.account === "vat_payable") outputVatUSD += (l.credit || 0) - (l.debit || 0);
      if (l.account === "vat_receivable") inputVatUSD += (l.debit || 0) - (l.credit || 0);
    }
  }
  const netVatDueUSD = outputVatUSD - inputVatUSD;
  const vatPayableBalanceUSD = -ledgerAccountBalance("vat_payable");
  const vatReceivableBalanceUSD = ledgerAccountBalance("vat_receivable");
  return {
    outputVatUSD: outputVatUSD,
    inputVatUSD: inputVatUSD,
    netVatDueUSD: netVatDueUSD,
    vatPayableBalanceUSD: vatPayableBalanceUSD,
    vatReceivableBalanceUSD: vatReceivableBalanceUSD
  };
}

  const startDate = document.getElementById("rpt-start").value;

function computeClientStatement(clientId) {
  const client = clientById(clientId);
  const invoices = computeInvoices().filter(i => i.clientId === clientId).sort((a, b) => new Date(a.issueDate) - new Date(b.issueDate));
  const invById = Object.fromEntries(invoices.map(i => [ i.id, i ]));
  const payments = state.payments.filter(p => invById[p.invoiceId]).sort((a, b) => new Date(a.date) - new Date(b.date)).map(p => Object.assign({}, p, {
    invoiceNumber: invById[p.invoiceId].number
  }));
  const totalInvoicedUSD = invoices.reduce((s, i) => s + usdEquivalent(i.amount, i.currency), 0);
  const totalPaidUSD = invoices.reduce((s, i) => s + usdEquivalent(i.paid, i.currency), 0);
  const totalOutstandingUSD = invoices.reduce((s, i) => s + usdEquivalent(Math.max(0, i.balance), i.currency), 0);
  return {
    client: client,
    invoices: invoices,
    payments: payments,
    totalInvoicedUSD: totalInvoicedUSD,
    totalPaidUSD: totalPaidUSD,
    totalOutstandingUSD: totalOutstandingUSD
  };
}

  const clientId = document.getElementById("rpt-client").value;

    toast("Select a client.", true);

function computeAgedReceivables() {
  const invoices = computeInvoices().filter(i => i.balance > 0 && i.status !== "cancelled");
  const today = new Date(todayISO());
  return invoices.map(inv => {
    const days = Math.floor((today - new Date(inv.dueDate)) / 864e5);
    const bucket = days <= 0 ? "Current" : days <= 30 ? "1–30d" : days <= 60 ? "31–60d" : days <= 90 ? "61–90d" : "90d+";
    return Object.assign({}, inv, {
      daysOverdue: Math.max(0, days),
      bucket: bucket,
      balanceUSD: usdEquivalent(inv.balance, inv.currency)
    });
  }).sort((a, b) => b.daysOverdue - a.daysOverdue);
}

const ZAKAT_TIER_LABELS = {
  family: "Tier One — Family",
  friends_neighbors: "Tier Two — Friends & Neighbors",
  institutional: "Tier Three — Institutional"
};

function computeZakatReport() {
  const zakatDue = state.zakatCalc.assets * state.zakatCalc.rate;
  const disbursedTotalUSD = state.zakatDisbursements.reduce((s, d) => s + usdEquivalent(d.amount, d.currency), 0);
  const disbursedTotal = usdToCurrency(disbursedTotalUSD, state.zakatCalc.currency);
  const byTierUSD = {
    family: 0,
    friends_neighbors: 0,
    institutional: 0
  };
  for (const d of state.zakatDisbursements) byTierUSD[d.tier] += usdEquivalent(d.amount, d.currency);
  const byTier = {};
  for (const k of Object.keys(byTierUSD)) byTier[k] = usdToCurrency(byTierUSD[k], state.zakatCalc.currency);
  const assetsUSD = usdEquivalent(state.zakatCalc.assets, state.zakatCalc.currency);
  const belowNisab = state.zakatCalc.nisabUSD > 0 && assetsUSD < state.zakatCalc.nisabUSD;
  return {
    zakatDue: zakatDue,
    disbursedTotal: disbursedTotal,
    byTier: byTier,
    remaining: zakatDue - disbursedTotal,
    belowNisab: belowNisab,
    assetsUSD: assetsUSD
  };
}

function computePayables() {
  const vendorTotals = {};
  for (const e of state.expenses) {
    const vendor = e.vendor || "No vendor on file";
    const usd = usdEquivalent(e.amount, e.currency);
    if (!vendorTotals[vendor]) vendorTotals[vendor] = {
      totalUSD: 0,
      count: 0
    };
    vendorTotals[vendor].totalUSD += usd;
    vendorTotals[vendor].count += 1;
  }
  const vendors = Object.entries(vendorTotals).map(([vendor, v]) => ({
    vendor: vendor,
    totalUSD: v.totalUSD,
    count: v.count
  })).sort((a, b) => b.totalUSD - a.totalUSD);
  const pendingConsent = state.expenses.filter(e => requiresJointConsent(e.amount, e.currency) && !e.consentConfirmed);
  const totalUSD = vendors.reduce((s, v) => s + v.totalUSD, 0);
  return {
    vendors: vendors,
    pendingConsent: pendingConsent,
    totalUSD: totalUSD
  };
}

function computeExpensesLedger(startDate, endDate) {
  const inRange = d => (!startDate || d >= startDate) && (!endDate || d <= endDate);
  const items = state.expenses.filter(e => inRange(e.date)).sort((a, b) => new Date(a.date) - new Date(b.date));
  const byCategory = {};
  let totalUSD = 0;
  for (const e of items) {
    const usd = usdEquivalent(e.amount, e.currency);
    totalUSD += usd;
    byCategory[e.category] = (byCategory[e.category] || 0) + usd;
  }
  return {
    items: items,
    byCategory: byCategory,
    totalUSD: totalUSD
  };
}

  });
  if (Math.abs(bs.zakatDistributionsUSD) > .005) rows.push({

    name: "Zakat Distributions",
    amountUSD: -bs.zakatDistributionsUSD
  });
  rows.push({

  for (const a of state.balanceSheetAccounts.filter(a => a.type === "equity")) rows.push({

function computeCashFlow(startDate, endDate) {
  const inRange = d => (!startDate || d >= startDate) && (!endDate || d <= endDate);
  let cashInUSD = 0, cashOutUSD = 0, zakatOutUSD = 0, charitableOutUSD = 0;
  for (const p of state.payments) if (inRange(p.date)) cashInUSD += usdEquivalent(p.amount, p.currency);
  for (const e of state.expenses) if (inRange(e.date)) cashOutUSD += usdEquivalent(e.amount, e.currency);
  for (const d of state.zakatDisbursements) if (inRange(d.date)) zakatOutUSD += usdEquivalent(d.amount, d.currency);
  for (const p of state.payments) {
    if (p.isLateCharge && p.charitableDisbursed && inRange(p.charitableDisbursedDate || p.date)) {
      charitableOutUSD += usdEquivalent(p.charitablePortion || 0, p.currency);
    }
  }
  const operatingNetUSD = cashInUSD - cashOutUSD - zakatOutUSD - charitableOutUSD;
  let investingUSD = 0, financingUSD = 0;
  const investingItems = [], financingItems = [];
  for (const t of state.cashFlowTransactions) {
    if (!inRange(t.date)) continue;
    const signed = t.direction === "out" ? -Math.abs(t.amount) : Math.abs(t.amount);
    const signedUSD = usdEquivalent(signed, t.currency);
    if (t.category === "investing") {
      investingUSD += signedUSD;
      investingItems.push(Object.assign({}, t, {
        signedUSD: signedUSD
      }));
    } else {
      financingUSD += signedUSD;
      financingItems.push(Object.assign({}, t, {
        signedUSD: signedUSD
      }));
    }
  }
  return {
    cashInUSD: cashInUSD,
    cashOutUSD: cashOutUSD,
    zakatOutUSD: zakatOutUSD,
    charitableOutUSD: charitableOutUSD,
    operatingNetUSD: operatingNetUSD,
    investingUSD: investingUSD,
    financingUSD: financingUSD,
    investingItems: investingItems,
    financingItems: financingItems,
    netChangeUSD: operatingNetUSD + investingUSD + financingUSD
  };
}

function computeBudgetVsActual(year) {
  return state.budgets.filter(b => b.year === year).map(b => {
    const budgetUSD = usdEquivalent(b.amount, b.currency);
    const actualUSD = state.expenses.filter(e => e.category === b.category && e.date.startsWith(year)).reduce((s, e) => s + usdEquivalent(e.amount, e.currency), 0);
    return {
      category: b.category,
      budgetUSD: budgetUSD,
      actualUSD: actualUSD,
      varianceUSD: budgetUSD - actualUSD
    };
  });
}

function computeComingDue(days) {
  const today = new Date(todayISO());
  const cutoff = new Date(today.getTime() + days * 864e5);
  return computeInvoices().filter(i => i.balance > 0 && i.status !== "cancelled").filter(inv => {
    const due = new Date(inv.dueDate);
    return due >= today && due <= cutoff;
  }).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
}

async function submitInvoiceModal() {
  const editId = document.getElementById("f-edit-id").value;
  const category = document.getElementById("f-category").value;
  const issueDate = document.getElementById("f-issue").value;
  const dueDate = document.getElementById("f-due").value;
  const amount = document.getElementById("f-amount").value;
  const currency = document.getElementById("f-currency").value;
  const vatRate = document.getElementById("f-vat-rate") ? document.getElementById("f-vat-rate").value : 0;
  const cryptoQty = isCrypto(currency) ? document.getElementById("f-crypto-qty").value : undefined;
  if (isCrypto(currency) && !isPositiveNumber(cryptoQty)) {
    toast("Crypto quantity must be a positive number.", true);
    return;
  }
  if (editId) {
    if (!isPositiveNumber(amount)) {
      toast("Invoice amount must be a positive number.", true);
      return;
    }
    if (dueDate < issueDate) {
      toast("Due date cannot be before the issue date.", true);
      return;
    }
    const inv = state.invoices.find(i => i.id === editId);
    const amountChanged = inv.amount !== Number(amount) || (inv.vatRate || 0) !== Number(vatRate);
    const newVatAmount = vatAmountFromTotal(Number(amount), Number(vatRate));
    Object.assign(inv, {
      category: category,
      issueDate: issueDate,
      dueDate: dueDate,
      amount: Number(amount),
      vatRate: Number(vatRate),
      vatAmount: newVatAmount,
      cryptoQty: cryptoQty !== undefined ? Number(cryptoQty) : undefined,
      notes: document.getElementById("f-notes").value.trim()
    });
    if (amountChanged) inv.consentConfirmed = false;
    if (amountChanged) {
      const amountUSD = usdEquivalent(inv.amount, inv.currency);
      const vatUSD = usdEquivalent(newVatAmount, inv.currency);
      const netRevenueUSD = amountUSD - vatUSD;
      const lines = [ {
        account: "accounts_receivable",
        debit: amountUSD,
        credit: 0
      }, {
        account: "revenue",
        debit: 0,
        credit: netRevenueUSD
      } ];
      if (vatUSD > .005) lines.push({
        account: "vat_payable",
        debit: 0,
        credit: vatUSD
      });
      updateJournalEntry(inv.issueDate, `Invoice ${inv.number} issued`, lines, "invoice", inv.id);
    }
    logActivity(`Invoice ${inv.number} updated${amountChanged ? ` (amount changed to ${fmtAmount(inv)}, consent reset)` : ""}`);
    await saveState();
    closeModal();
    render();
    toast(`Invoice ${inv.number} updated`);
  } else {
    const sel = document.getElementById("f-client");
    await addInvoice({
      clientId: sel.value,
      category: category,
      currency: currency,
      issueDate: issueDate,
      dueDate: dueDate,
      amount: amount,
      vatRate: vatRate,
      cryptoQty: cryptoQty !== undefined ? Number(cryptoQty) : undefined,
      notes: document.getElementById("f-notes").value.trim()
    });
  }
}

function addMonths(dateStr, months) {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0, 10);
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function submitDuplicateModal() {
  const sourceId = document.getElementById("f-source-id").value;
  const inv = invoiceById(sourceId);
  if (!inv) {
    toast("Source invoice not found.", true);
    return;
  }
  const interval = document.getElementById("f-interval").value;
  let newIssueDate, newDueDate;
  const gapDays = Math.round((new Date(inv.dueDate) - new Date(inv.issueDate)) / 864e5);
  if (interval === "1month") {
    newIssueDate = addMonths(inv.issueDate, 1);
    newDueDate = addDays(newIssueDate, gapDays);
  } else if (interval === "3month") {
    newIssueDate = addMonths(inv.issueDate, 3);
    newDueDate = addDays(newIssueDate, gapDays);
  } else {
    const days = Number(document.getElementById("f-custom-days").value) || 30;
    newIssueDate = addDays(inv.issueDate, days);
    newDueDate = addDays(newIssueDate, gapDays);
  }
  addInvoice({
    clientId: inv.clientId,
    category: inv.category,
    currency: inv.currency,
    issueDate: newIssueDate,
    dueDate: newDueDate,
    amount: inv.amount,
    cryptoQty: inv.cryptoQty
  });
}

let pendingAttachment = undefined;

const ATTACHMENT_MAX_BYTES = 500 * 1024;

function handleAttachmentSelect(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  if (file.size > ATTACHMENT_MAX_BYTES) {
    toast("Attachment must be 500KB or smaller — this dashboard stores it inline, not as a real file store.", true);
    inputEl.value = "";
    return;
  }
  const reader = new FileReader;
  reader.onload = () => {
    pendingAttachment = {
      filename: file.name,
      mimeType: file.type,
      dataUrl: reader.result
    };
    toast(`${file.name} attached — saved when you save this expense.`);
  };
  reader.onerror = () => toast("Could not read that file.", true);
  reader.readAsDataURL(file);
}

const MIN_PASSPHRASE_LENGTH = 8;

const COMMON_WEAK_PASSPHRASES = new Set([ "password", "password1", "password123", "12345678", "123456789", "1234567890", "qwertyui", "qwerty123", "letmein1", "letmein123", "welcome1", "welcome123", "admin1234", "iloveyou1", "changeme1", "passw0rd", "passw0rd1", "11111111", "00000000", "abc12345", "trustno1", "football1", "baseball1", "dragon123", "monkey123", "sunshine1", "princess1", "starwars1", "freedom123", "whatever1" ]);

function passphraseStrength(pass) {
  if (!pass) return {
    label: "",
    score: -1,
    blocked: false
  };
  if (COMMON_WEAK_PASSPHRASES.has(pass.toLowerCase())) {
    return {
      label: "Very weak — one of the most commonly used passphrases; pick something else",
      score: 0,
      blocked: true
    };
  }
  const classes = [ /[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/ ].filter(re => re.test(pass)).length;
  let score;
  if (pass.length < MIN_PASSPHRASE_LENGTH) score = 0; else if (pass.length < 12) score = classes >= 3 ? 2 : 1; else if (pass.length < 16) score = classes >= 2 ? 3 : 2; else score = 3;
  return {
    label: [ "Weak", "Fair", "Good", "Strong" ][score],
    score: score,
    blocked: false
  };
}

function updatePassphraseStrengthDisplay() {
  const input = document.getElementById("f-new-pass");
  const el = document.getElementById("passphrase-strength");
  if (!input || !el) return;
  const s = passphraseStrength(input.value);
  const colors = [ "#B23B3B", "#A9720A", "#1F3A5F", "#2A6F3F" ];
  el.textContent = s.label ? `Strength: ${s.label}` : "";
  el.style.color = s.score >= 0 ? colors[Math.max(0, s.score)] : "#6B7280";
}

async function boot() {
  if (SUPABASE_ENABLED) {
    await bootSupabase();
    return;
  }
  const raw = loadRawStorage();
  if (!raw) {
    render();
    return;
  }
  if (raw.encrypted) {
    showUnlockScreen(raw);
    return;
  }
  state = migrateLegacyState(raw);
  if (await chainActivityLog()) await saveState();
  await verifyActivityLogChain();
}

let autoLockTimer = null;

function resetAutoLockTimer() {
  if (autoLockTimer) {
    clearTimeout(autoLockTimer);
    autoLockTimer = null;
  }
  if (SUPABASE_ENABLED) {
    if (!currentProfile) return;
    const minutes = state.settings.autoLockMinutes;
    if (!minutes || minutes <= 0) return;
    autoLockTimer = setTimeout(() => signOutSupabase(), minutes * 60 * 1e3);
    return;
  }
  if (!encryptionPassphrase) return;
  const minutes = state.settings.autoLockMinutes;
  if (!minutes || minutes <= 0) return;
  autoLockTimer = setTimeout(triggerAutoLock, minutes * 60 * 1e3);
}

async function submitUnlockAttempt() {
  const passphrase = document.getElementById("unlock-passphrase").value;
  const btn = document.getElementById("unlock-btn");
  btn.textContent = "Decrypting…";
  btn.disabled = true;
  try {
    const plaintext = await decryptText(window.__pendingEncryptedBlob, passphrase);
    state = migrateLegacyState(JSON.parse(plaintext));
    encryptionPassphrase = passphrase;
    if (await chainActivityLog()) await saveState();
    resetAutoLockTimer();
    await verifyActivityLogChain();
  } catch (e) {
    showUnlockScreen(window.__pendingEncryptedBlob, "Incorrect passphrase, or this data is corrupted.");
  }
}

on class="btn btn-navy" style="width:100%;" onclick="submitChangePassphrase()">Save</button>\n          <button class="btn-outline" style="width:100%; margin-top:8px; text-align:center;" onclick="submitDisableEncryption()">Decrypt and Remove Encryption</button>\n        `}\n      </div>\n    </div>`;

async function submitEnableEncryption() {
  const pass = document.getElementById("f-new-pass").value;
  const confirmPass = document.getElementById("f-confirm-pass").value;
  if (pass.length < MIN_PASSPHRASE_LENGTH) {
    toast(`Passphrase must be at least ${MIN_PASSPHRASE_LENGTH} characters.`, true);
    return;
  }
  if (passphraseStrength(pass).blocked) {
    toast("That passphrase is too commonly used to protect financial records — choose something less guessable.", true);
    return;
  }
  if (pass !== confirmPass) {
    toast("Passphrase and confirmation must match.", true);
    return;
  }
  encryptionPassphrase = pass;
  await saveState();
  resetAutoLockTimer();
  closeModal();
  render();
  toast("Encryption enabled. This passphrase cannot be recovered if lost — store it somewhere safe.");
}

async function submitChangePassphrase() {
  const current = document.getElementById("f-current-pass").value;
  if (current !== encryptionPassphrase) {
    toast("Current passphrase is incorrect.", true);

  const newPass = document.getElementById("f-new-pass").value;
  if (!newPass) {
    closeModal();
    return;
  }
  const confirmPass = document.getElementById("f-confirm-pass").value;
  if (newPass.length < MIN_PASSPHRASE_LENGTH) {
    toast(`Passphrase must be at least ${MIN_PASSPHRASE_LENGTH} characters.`, true);
    return;
  }
  if (passphraseStrength(newPass).blocked) {
    toast("That passphrase is too commonly used to protect financial records — choose something less guessable.", true);
    return;
  }
  if (newPass !== confirmPass) {
    toast("New passphrase and confirmation must match.", true);
    return;
  }
  encryptionPassphrase = newPass;
  await saveState();
  closeModal();
  render();
  toast("Passphrase updated.");
}

async function submitDisableEncryption() {
  const current = prompt("Enter your current passphrase to remove encryption:");
  if (current === null) return;
  if (current !== encryptionPassphrase) {
    toast("Incorrect passphrase — encryption not removed.", true);
    return;
  }
  if (!confirm("Remove encryption? The data will be saved as plain, unencrypted storage again.")) return;
  encryptionPassphrase = null;
  await saveState();
  resetAutoLockTimer();
  closeModal();
  render();
  toast("Encryption removed.");
}

boot();</script>
