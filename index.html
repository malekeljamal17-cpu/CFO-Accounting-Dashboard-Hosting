  .brand-text strong { font-family: Georgia, serif; font-size: 14px; display: block; }
  .brand-text span { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 0.03em; }
  .nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }

  .nav-item.active { background: rgba(182,130,53,0.18); color: var(--gold-light); }
  .sidebar-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
  .sidebar-footer button { display: flex; align-items: center; gap: 6px; background: none; border: none; color: rgba(255,255,255,0.65); font-size: 12px; cursor: pointer; padding: 0; font-family: inherit; }

function fmt(n, cur) {
  const num = Number(n || 0);
  const symbol = cur === "QAR" ? "QAR " : cur === "LBP" ? "LBP " : "$";
  const digits = Math.abs(num).toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  return (num < 0 ? "-" : "") + symbol + digits;
}

const isPositiveNumber = v => Number.isFinite(Number(v)) && Number(v) > 0;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

const CRYPTO_CURRENCIES = [ "BTC", "ETH", "USDT", "USDC" ];

const isCrypto = currency => CRYPTO_CURRENCIES.includes(currency);

function fmtCrypto(cryptoQty, currency, usdValue) {
  const qtyDisplay = Number(cryptoQty || 0).toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 8
  });
  return `${qtyDisplay} ${currency} (≈ ${fmt(usdValue, "USD")})`;
}

function fmtAmount(record) {
  return isCrypto(record.currency) ? fmtCrypto(record.cryptoQty, record.currency, record.amount) : fmt(record.amount, record.currency);

function notesIndicator(record, type) {
  const parts = [];

}

const SAFE_ATTACHMENT_DATA_URL = /^data:(image\/[a-z0-9.+-]+|application\/pdf);base64,/i;

function openAttachment(type, recordId) {
  const collection = NOTES_COLLECTION[type] ? NOTES_COLLECTION[type]() : [];
  const record = collection.find(r => r.id === recordId);
  if (!record || !record.attachment) return;
  if (!SAFE_ATTACHMENT_DATA_URL.test(record.attachment.dataUrl || "")) {
    toast("This attachment is not a valid file and cannot be opened.", true);
    return;

  const w = window.open();
  if (!w) {
    toast("Pop-up blocked — allow pop-ups to view the attachment.", true);
    return;
  }
  w.opener = null;
  w.location = record.attachment.dataUrl;
}

const SEED_JOURNAL_ENTRIES = [];

function postJournalEntry(date, description, lines, sourceType, sourceId) {
  const totalDebit = lines.reduce((s, l) => s + (l.debit || 0), 0);
  const totalCredit = lines.reduce((s, l) => s + (l.credit || 0), 0);
  if (Math.abs(totalDebit - totalCredit) > .005) {
    console.error("Unbalanced journal entry blocked:", description, lines);
    return null;
  }
  const entry = {
    id: uid(),
    date: date,
    description: description,
    lines: lines,
    sourceType: sourceType,
    sourceId: sourceId
  };
  state.journalEntries.push(entry);
  return entry.id;
}

function findJournalEntry(sourceType, sourceId) {
  return state.journalEntries.find(e => e.sourceType === sourceType && e.sourceId === sourceId);
}

function updateJournalEntry(date, description, lines, sourceType, sourceId) {
  const existing = findJournalEntry(sourceType, sourceId);
  const totalDebit = lines.reduce((s, l) => s + (l.debit || 0), 0);
  const totalCredit = lines.reduce((s, l) => s + (l.credit || 0), 0);
  if (Math.abs(totalDebit - totalCredit) > .005) {
    console.error("Unbalanced journal entry update blocked:", description, lines);
    return;
  }
  if (existing) {
    Object.assign(existing, {
      date: date,
      description: description,
      lines: lines
    });
  } else {
    postJournalEntry(date, description, lines, sourceType, sourceId);
  }
}

async function removeJournalEntry(sourceType, sourceId) {
  const entry = findJournalEntry(sourceType, sourceId);
  state.journalEntries = state.journalEntries.filter(e => !(e.sourceType === sourceType && e.sourceId === sourceId));
  if (entry) await supabaseDelete("journal_entries", entry.id);
  if (entry && state.bankStatementLines) {
    for (const l of state.bankStatementLines) if (l.matchedEntryId === entry.id) l.matchedEntryId = null;
  }
}

function ledgerAccountBalance(account) {
  let debit = 0, credit = 0;
  for (const e of state.journalEntries) for (const l of e.lines) if (l.account === account) {
    debit += l.debit || 0;
    credit += l.credit || 0;
  }
  return debit - credit;
}

const CONSENT_THRESHOLD_USD = 15e3;

function usdEquivalent(amount, currency) {
  if (currency === "QAR") return amount / state.settings.qarPerUsd;
  if (currency === "LBP") return amount / state.settings.lbpPerUsd;
  return Number(amount);
}

function usdToQar(amountUSD) {
  return amountUSD * state.settings.qarPerUsd;
}

function usdToLbp(amountUSD) {
  return amountUSD * state.settings.lbpPerUsd;
}

function usdToCurrency(amountUSD, currency) {
  if (currency === "QAR") return usdToQar(amountUSD);
  if (currency === "LBP") return usdToLbp(amountUSD);
  return amountUSD;
}

function requiresJointConsent(amount, currency) {
  return usdEquivalent(amount, currency) > CONSENT_THRESHOLD_USD;
}

function consentGuidance(amount, currency, contextLabel, clauseRef) {
  if (!requiresJointConsent(amount, currency)) return null;
  const usd = usdEquivalent(amount, currency);
  const amountDisplay = currency === "QAR" || currency === "LBP" ? `${currency} ${amount.toLocaleString()}, approx. USD ${Math.round(usd).toLocaleString()}` : isCrypto(currency) ? `≈ USD ${amount.toLocaleString()} (recorded fair value)` : `USD ${amount.toLocaleString()}`;
  return `This ${contextLabel} (${amountDisplay}) exceeds the USD 15,000 threshold — per ${clauseRef}, it requires joint written consent of both Managing Partners before release.`;
}

function backfillJournalEntries(parsed) {
  const qarPerUsd = parsed.settings.qarPerUsd;
  const lbpPerUsd = parsed.settings.lbpPerUsd;
  const usd = (amount, currency) => currency === "QAR" ? amount / qarPerUsd : currency === "LBP" ? amount / lbpPerUsd : Number(amount);
  const push = (date, description, lines, sourceType, sourceId) => {
    const totalDebit = lines.reduce((s, l) => s + (l.debit || 0), 0);
    const totalCredit = lines.reduce((s, l) => s + (l.credit || 0), 0);
    if (Math.abs(totalDebit - totalCredit) > .005) {
      console.error("Unbalanced backfill entry skipped:", description);
      return;
    }
    parsed.journalEntries.push({
      id: uid(),
      date: date,
      description: description,
      lines: lines,
      sourceType: sourceType,
      sourceId: sourceId
    });
  };
  const paidByInvoice = {};
  for (const p of parsed.payments) if (!p.isLateCharge) paidByInvoice[p.invoiceId] = (paidByInvoice[p.invoiceId] || 0) + p.amount;
  for (const inv of parsed.invoices) {
    const amountUSD = usd(inv.amount, inv.currency);
    const vatUSD = usd(inv.vatAmount || 0, inv.currency);
    const lines = [ {
      account: "accounts_receivable",
      debit: amountUSD,
      credit: 0
    }, {
      account: "revenue",
      debit: 0,
      credit: amountUSD - vatUSD
    } ];
    if (vatUSD > .005) lines.push({
      account: "vat_payable",
      debit: 0,
      credit: vatUSD
    });
    push(inv.issueDate, `Invoice ${inv.number} issued`, lines, "invoice", inv.id);
    if (inv.status === "cancelled") {
      const paid = paidByInvoice[inv.id] || 0;
      const balance = Math.max(0, inv.amount - paid);
      if (balance > 0) {
        const balanceUSD = usd(balance, inv.currency);
        const vatPortion = amountUSD > .005 ? round2(balanceUSD * (vatUSD / amountUSD)) : 0;
        const badDebtPortion = round2(balanceUSD - vatPortion);
        const cancelLines = [ {
          account: "bad_debt_expense",
          debit: badDebtPortion,
          credit: 0
        } ];
        if (vatPortion > .005) cancelLines.push({
          account: "vat_payable",
          debit: vatPortion,
          credit: 0
        });
        cancelLines.push({
          account: "accounts_receivable",
          debit: 0,
          credit: round2(balanceUSD)
        });
        push(inv.issueDate, `Invoice ${inv.number} cancelled (uncollected portion written off as bad debt)`, cancelLines, "invoice-cancel", inv.id);
      }
    }
  }
  for (const p of parsed.payments) {
    const amountUSD = usd(p.amount, p.currency);
    if (p.isLateCharge) {
      const actualCostUSD = usd(p.actualCost || 0, p.currency);
      const charitableUSD = usd(p.charitablePortion || 0, p.currency);
      const lines = [ {
        account: "cash",
        debit: amountUSD,
        credit: 0
      }, {
        account: "revenue",
        debit: 0,
        credit: actualCostUSD
      } ];
      if (charitableUSD > 0) lines.push({
        account: "zakat_payable",
        debit: 0,
        credit: charitableUSD
      });
      push(p.date, `Late charge ${p.number} collected`, lines, "payment", p.id);
      if (p.charitableDisbursed && charitableUSD > 0) {
        push(p.charitableDisbursedDate || p.date, `${p.number} charitable portion disbursed`, [ {
          account: "zakat_payable",
          debit: charitableUSD,
          credit: 0
        }, {
          account: "cash",
          debit: 0,
          credit: charitableUSD
        } ], "charitable-disbursement", p.id);
      }
    } else {
      push(p.date, `Payment ${p.number} received`, [ {
        account: "cash",
        debit: amountUSD,
        credit: 0
      }, {
        account: "accounts_receivable",
        debit: 0,
        credit: amountUSD
      } ], "payment", p.id);
    }
  }
  for (const e of parsed.expenses) {
    const amountUSD = usd(e.amount, e.currency);
    const vatUSD = usd(e.vatAmount || 0, e.currency);
    const lines = [ {
      account: "expense",
      debit: amountUSD - vatUSD,
      credit: 0
    } ];
    if (vatUSD > .005) lines.push({
      account: "vat_receivable",
      debit: vatUSD,
      credit: 0
    });
    lines.push({
      account: "cash",
      debit: 0,
      credit: amountUSD
    });
    push(e.date, `Expense ${e.number} recorded`, lines, "expense", e.id);
  }
  for (const d of parsed.zakatDisbursements) {
    const amountUSD = usd(d.amount, d.currency);
    push(d.date, `Zakat disbursement ${d.number} to ${d.recipient}`, [ {
      account: "zakat_distributions",

      debit: 0,
      credit: amountUSD

      debit: amountUSD,
      credit: 0
    }, {
      account: "cash",
      debit: 0,
      credit: amountUSD
    } ] : [ {
      account: "cash",
      debit: amountUSD,
      credit: 0
    }, {
      account: offsetAccount,
      debit: 0,
      credit: amountUSD
    } ];
    push(t.date, `${t.number}: ${t.description}`, lines, "cashflow", t.id);
  }
}

function backfillReferenceNumbers(collection, prefix) {
  const year = (new Date).getFullYear();
  let maxSeq = 0;
  const re = new RegExp(`${prefix}-(\\d{4})-(\\d+)$`);
  for (const item of collection) {
    if (item.number) {
      const m = item.number.match(re);
      if (m) maxSeq = Math.max(maxSeq, parseInt(m[2], 10));
    }
  }
  for (const item of collection) {
    if (!item.number) {
      maxSeq += 1;
      item.number = `${prefix}-${year}-${String(maxSeq).padStart(4, "0")}`;
    }
  }
}

function loadRawStorage() {
  try {

function sanitizeAttachments(collection) {
  for (const item of collection || []) {
    if (item && item.attachment && !SAFE_ATTACHMENT_DATA_URL.test(item.attachment.dataUrl || "")) delete item.attachment;

}

function camelToSnake(k) {
  return k.replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1_$2").toLowerCase();
}

function snakeToCamel(k) {
  return k.replace(/_([a-z0-9])/g, (_, c) => c.toUpperCase());
}

function rowToCamel(row) {
  const out = {};
  for (const k in row) out[snakeToCamel(k)] = row[k];
  return out;
}

function recordToSnake(rec) {
  const out = {};
  for (const k in rec) {
    if (rec[k] === undefined) continue;
    out[camelToSnake(k)] = rec[k];
  }
  return out;
}

async function loadStateFromSupabase() {
  const results = await Promise.all(SB_TABLES.map(cfg => cfg.singleton ? sb.from(cfg.table).select("*").eq("id", 1).single() : sb.from(cfg.table).select("*").order(cfg.orderBy || "created_at", {
    ascending: true
  })));
  const activityLogResult = await sb.from("activity_log").select("*").order("at", {
    ascending: true
  });
  const errors = [ ...results, activityLogResult ].filter(r => r.error);
  if (errors.length) {
    throw new Error("Failed to load data from Supabase: " + errors.map(e => e.error.message).join("; "));
  }
  const next = {};
  SB_TABLES.forEach((cfg, i) => {
    const data = results[i].data;
    next[cfg.key] = cfg.singleton ? rowToCamel(data) : (data || []).map(rowToCamel);
  });
  if (typeof next.settings.qarPerUsd !== "number") next.settings.qarPerUsd = SEED_SETTINGS.qarPerUsd;
  if (typeof next.settings.lbpPerUsd !== "number") next.settings.lbpPerUsd = SEED_SETTINGS.lbpPerUsd;
  if (typeof next.settings.autoLockMinutes !== "number") next.settings.autoLockMinutes = SEED_SETTINGS.autoLockMinutes;
  if (typeof next.settings.vatRatePercent !== "number") next.settings.vatRatePercent = SEED_SETTINGS.vatRatePercent;
  if (typeof next.settings.insuranceAlertDays !== "number") next.settings.insuranceAlertDays = SEED_SETTINGS.insuranceAlertDays;
  if (!next.settings.serviceCategories || !Object.keys(next.settings.serviceCategories).length) next.settings.serviceCategories = DEFAULT_SERVICE_CATEGORIES;
  if (!next.settings.rateCard || !Object.keys(next.settings.rateCard).length) next.settings.rateCard = DEFAULT_RATE_CARD;
  next.settings.authorizedActors = [];
  if (typeof next.zakatCalc.assets !== "number") next.zakatCalc.assets = SEED_ZAKAT_CALC.assets;
  if (!next.zakatCalc.currency) next.zakatCalc.currency = SEED_ZAKAT_CALC.currency;
  if (typeof next.zakatCalc.rate !== "number") next.zakatCalc.rate = SEED_ZAKAT_CALC.rate;
  if (typeof next.zakatCalc.nisabUsd !== "number") next.zakatCalc.nisabUsd = SEED_ZAKAT_CALC.nisabUSD;
  next.zakatCalc.nisabUSD = next.zakatCalc.nisabUsd;
  delete next.zakatCalc.nisabUsd;
  if (typeof next.reconciliation.statementEndingBalanceUsd !== "number") next.reconciliation.statementEndingBalanceUsd = 0;
  next.reconciliation.statementEndingBalanceUSD = next.reconciliation.statementEndingBalanceUsd;
  delete next.reconciliation.statementEndingBalanceUsd;
  next.activityLog = (activityLogResult.data || []).map(row => {
    const entry = rowToCamel(row);
    entry.at = new Date(entry.at).toISOString();
    entry._synced = true;
    return entry;
  });
  state = next;
}

async function syncAllToSupabase() {
  if (!SUPABASE_ENABLED) return;
  const ops = SB_TABLES.map(cfg => {
    if (cfg.singleton) return sb.from(cfg.table).update(recordToSnake(state[cfg.key])).eq("id", 1);
    const rows = state[cfg.key];
    if (!rows.length) return Promise.resolve({
      error: null
    });
    return sb.from(cfg.table).upsert(rows.map(recordToSnake));
  });
  ops.push(syncActivityLogToSupabase());
  const results = await Promise.all(ops);
  const errors = results.filter(r => r && r.error);
  if (errors.length) {
    console.error("Supabase sync errors:", errors);
    toast(`Save failed — this change was NOT saved to the shared database (${errors[0].error.message}). Check your connection and try again.`, true);
    throw new Error("Supabase sync failed: " + errors.map(e => e.error.message).join("; "));
  }
}

async function syncActivityLogToSupabase() {
  const unsynced = state.activityLog.filter(e => !e._synced);
  if (!unsynced.length) return {
    error: null
  };
  const payload = unsynced.map(e => {
    const {_synced: _synced, ...rest} = e;
    return recordToSnake(rest);
  });
  const result = await sb.from("activity_log").insert(payload);
  if (!result.error) for (const e of unsynced) e._synced = true;
  return result;
}

async function supabaseDelete(table, id) {
  if (!SUPABASE_ENABLED) return;
  const result = await sb.from(table).delete().eq("id", id);
  if (result.error) {
    console.error("Supabase delete error:", result.error);
    toast(`Delete failed — this record is still in the shared database (${result.error.message}). Try again.`, true);
    throw new Error("Supabase delete failed: " + result.error.message);
  }
}

async function bootSupabase() {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") {
      if (autoLockTimer) {
        clearTimeout(autoLockTimer);
        autoLockTimer = null;
      }
      currentProfile = null;
      clearSensitiveStateFromMemory();
      authScreen = "login";
      renderAuthScreen();
      return;
    }
    if (event === "PASSWORD_RECOVERY" || session && pendingPasswordSetup) {
      authScreen = "set-password";
      authScreenError = null;
      renderAuthScreen();
      return;
    }
    if (session && !currentProfile) {
      resolveSession(session);
      return;
    }
    if (!session && authScreen !== "set-password") {
      authScreen = "login";
      renderAuthScreen();
    }
  });
}

async function resolveSession(session) {
  if (resolvingSession) return;
  resolvingSession = true;
  try {
    authScreen = "loading";
    authScreenError = null;
    renderAuthScreen();
    const {data: profile, error: profileError} = await sb.from("profiles").select("*").eq("id", session.user.id).single();
    if (profileError || !profile || !profile.is_active) {
      authScreen = "not-authorized";
      renderAuthScreen();
      return;
    }
    currentProfile = rowToCamel(profile);
    try {
      await loadStateFromSupabase();
    } catch (e) {
      console.error(e);
      authScreen = "load-error";
      authScreenError = e.message;
      renderAuthScreen();
      return;
    }
    authScreen = null;
    resetAutoLockTimer();
    render();
  } finally {
    resolvingSession = false;
  }
}

const ACTIVITY_LOG_MAX = 500;

function logActivity(text) {
  state.activityLog.push({
    id: uid(),
    at: (new Date).toISOString(),
    text: text,
    by: actingAsName()
  });
  if (state.activityLog.length > ACTIVITY_LOG_MAX) state.activityLog.splice(0, state.activityLog.length - ACTIVITY_LOG_MAX);
}

const ACTIVITY_LOG_GENESIS = "0".repeat(64);

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", (new TextEncoder).encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function activityLogHashInput(prevHash, entry) {
  return `${prevHash}|${entry.id}|${entry.at}|${entry.text}|${entry.by || ""}`;
}

async function chainActivityLog() {
  const log = state.activityLog;
  let changed = false;
  for (let i = 0; i < log.length; i++) {
    if (log[i].hash) continue;
    const prevHash = i > 0 ? log[i - 1].hash || ACTIVITY_LOG_GENESIS : ACTIVITY_LOG_GENESIS;
    log[i].prevHash = prevHash;
    log[i].hash = await sha256Hex(activityLogHashInput(prevHash, log[i]));
    changed = true;
  }
  return changed;
}

async function verifyActivityLogChain() {
  await chainActivityLog();
  const log = state.activityLog;
  let brokenIndex = null;
  for (let i = 0; i < log.length; i++) {
    const recomputed = await sha256Hex(activityLogHashInput(log[i].prevHash, log[i]));
    const linkOk = i === 0 || log[i].prevHash === log[i - 1].hash;
    if (recomputed !== log[i].hash || !linkOk) {
      brokenIndex = i;
      break;
    }
  }
  activityLogVerification = {
    checkedAt: (new Date).toISOString(),
    ok: brokenIndex === null,
    brokenIndex: brokenIndex,
    count: log.length
  };
  render();
}

  await chainActivityLog();
  return sha256Hex(integrityFingerprintPayload());
}

function formatFingerprint(hex) {
  return (hex.match(/.{1,4}/g) || [ hex ]).join("-").toUpperCase();
}

async function generateIntegrityCheckpoint(note) {
  const fingerprint = await computeIntegrityFingerprint();
  const checkpoint = {

const PBKDF2_ITERATIONS = 3e5;

function bytesToBase64(bytes) {
  return btoa(String.fromCharCode(...bytes));
}

function base64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function deriveKey(passphrase, saltBytes) {
  const keyMaterial = await crypto.subtle.importKey("raw", (new TextEncoder).encode(passphrase), "PBKDF2", false, [ "deriveKey" ]);
  return crypto.subtle.deriveKey({
    name: "PBKDF2",
    salt: saltBytes,
    iterations: PBKDF2_ITERATIONS,
    hash: "SHA-256"
  }, keyMaterial, {
    name: "AES-GCM",
    length: 256
  }, false, [ "encrypt", "decrypt" ]);
}

async function encryptText(plaintext, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const ciphertextBuf = await crypto.subtle.encrypt({
    name: "AES-GCM",
    iv: iv
  }, key, (new TextEncoder).encode(plaintext));
  return {
    encrypted: true,
    salt: bytesToBase64(salt),
    iv: bytesToBase64(iv),
    ciphertext: bytesToBase64(new Uint8Array(ciphertextBuf))
  };
}

async function decryptText(blob, passphrase) {
  const salt = base64ToBytes(blob.salt);
  const iv = base64ToBytes(blob.iv);
  const key = await deriveKey(passphrase, salt);
  const plaintextBuf = await crypto.subtle.decrypt({
    name: "AES-GCM",
    iv: iv
  }, key, base64ToBytes(blob.ciphertext));
  return (new TextDecoder).decode(plaintextBuf);
}

  const qtyGroup = document.getElementById("crypto-qty-group");
  const note = document.getElementById("crypto-sharia-note");
  const amountLabel = document.getElementById("amount-field-label");
  if (qtyGroup) qtyGroup.classList.toggle("hidden", !isC);
  if (note) note.classList.toggle("hidden", !isC);
  if (amountLabel) amountLabel.textContent = isC ? "USD Value at Transaction (fair value when recorded)" : "Amount";
}

function clientById(id) {
  return state.clients.find(c => c.id === id);
}

function computeInvoices() {
  const paidByInvoice = {};
  for (const p of state.payments) if (!p.isLateCharge) paidByInvoice[p.invoiceId] = (paidByInvoice[p.invoiceId] || 0) + p.amount;
  return state.invoices.map(inv => {
    const paid = paidByInvoice[inv.id] || 0;
    let status = inv.status;
    if (status !== "cancelled") {
      if (paid >= inv.amount) status = "paid"; else if (paid > 0) status = "partially_paid"; else status = inv.dueDate < todayISO() ? "overdue" : inv.status === "draft" ? "draft" : "sent";
    }
    return Object.assign({}, inv, {
      paid: paid,
      balance: inv.amount - paid,
      status: status
    });
  });
}

function invoiceById(id) {
  return computeInvoices().find(i => i.id === id);
}

function nextReferenceNumber(prefix, collection, field) {
  const year = (new Date).getFullYear();
  let maxSeq = 0;
  const re = new RegExp(`${prefix}-(\\d{4})-(\\d+)$`);
  for (const item of collection) {
    const m = (item[field] || "").match(re);
    if (m && Number(m[1]) === year) maxSeq = Math.max(maxSeq, parseInt(m[2], 10));
  }
  return `${prefix}-${year}-${String(maxSeq + 1).padStart(4, "0")}`;
}

function nextInvoiceNumber() {
  return nextReferenceNumber("CFO", state.invoices, "number");
}

async function addClient(data) {

}

function vatAmountFromTotal(totalAmount, vatRatePercent) {
  const rate = Number(vatRatePercent) || 0;
  if (rate <= 0) return 0;
  return round2(totalAmount - totalAmount / (1 + rate / 100));
}

async function addInvoice(data) {
  if (!isPositiveNumber(data.amount)) {
    toast("Invoice amount must be a positive number.", true);
    return;
  }
  if (data.dueDate < data.issueDate) {
    toast("Due date cannot be before the issue date.", true);
    return;
  }
  const num = nextInvoiceNumber();
  const amount = Number(data.amount);
  const vatRate = Number(data.vatRate) || 0;
  const vatAmount = vatAmountFromTotal(amount, vatRate);
  const invId = uid();
  state.invoices.push(Object.assign({
    id: invId,
    number: num,
    status: "draft",
    consentConfirmed: false,
    createdBy: actingAsName()
  }, data, {
    amount: amount,
    vatRate: vatRate,
    vatAmount: vatAmount
  }));
  const amountUSD = usdEquivalent(amount, data.currency);
  const vatUSD = usdEquivalent(vatAmount, data.currency);
  const netRevenueUSD = amountUSD - vatUSD;
  const lines = [ {
    account: "accounts_receivable",
    debit: amountUSD,
    credit: 0
  }, {
    account: "revenue",
    debit: 0,
    credit: netRevenueUSD
  } ];
  if (vatUSD > .005) lines.push({
    account: "vat_payable",
    debit: 0,
    credit: vatUSD
  });
  postJournalEntry(data.issueDate, `Invoice ${num} issued`, lines, "invoice", invId);
  logActivity(`Invoice ${num} created (${fmt(amount, data.currency)}${vatAmount > 0 ? `, incl. ${fmt(vatAmount, data.currency)} VAT` : ""})`);
  await saveState();
  closeModal();
  render();
  toast(consentGuidance(amount, data.currency, "invoice", "Article 20(B)(2) of the By-Laws") || `Invoice ${num} created`);
}

async function deleteInvoice(id) {
  const hasPayments = state.payments.some(p => p.invoiceId === id);
  if (hasPayments) {
    toast("Cannot delete an invoice with recorded payments. Cancel it instead.", true);
    return;
  }
  if (!confirm("Delete this invoice?")) return;
  const inv = state.invoices.find(i => i.id === id);
  state.invoices = state.invoices.filter(i => i.id !== id);
  await supabaseDelete("invoices", id);
  await removeJournalEntry("invoice", id);
  logActivity(`Invoice ${inv?.number} deleted`);
  await saveState();
  render();
  toast("Invoice deleted");
}

async function updateInvoiceStatus(id, status) {
  const inv = state.invoices.find(i => i.id === id);
  if (!inv) return;
  if (status === "cancelled" && !confirm(`Cancel invoice ${inv.number}? This is permanent — this dashboard has no way to un-cancel it afterward.`)) return;
  if (status === "cancelled") {
    const computed = invoiceById(id);
    const balanceUSD = usdEquivalent(computed.balance, computed.currency);
    if (balanceUSD > .005) {
      const totalUSD = usdEquivalent(computed.amount, computed.currency);
      const vatUSD = usdEquivalent(computed.vatAmount || 0, computed.currency);
      const vatPortion = totalUSD > .005 ? round2(balanceUSD * (vatUSD / totalUSD)) : 0;
      const badDebtPortion = round2(balanceUSD - vatPortion);
      const lines = [ {
        account: "bad_debt_expense",
        debit: badDebtPortion,
        credit: 0
      } ];
      if (vatPortion > .005) lines.push({
        account: "vat_payable",
        debit: vatPortion,
        credit: 0
      });
      lines.push({
        account: "accounts_receivable",
        debit: 0,
        credit: round2(balanceUSD)
      });
      postJournalEntry(todayISO(), `Invoice ${inv.number} cancelled (uncollected portion written off as bad debt)`, lines, "invoice-cancel", id);
    }
  }
  inv.status = status;
  logActivity(`Invoice ${inv.number} status set to "${status}"`);
  await saveState();
  render();
}

async function addPayment(data, editId) {
  const inv = invoiceById(data.invoiceId);
  if (!inv) {
    toast("Invoice not found.", true);
    return;
  }
  if (inv.status === "cancelled") {
    toast("Cannot record a payment against a cancelled invoice.", true);
    return;
  }
  if (!isPositiveNumber(data.amount)) {
    toast("Payment amount must be a positive number.", true);
    return;
  }
  if (data.currency !== inv.currency) {
    toast(`Payment currency (${data.currency}) must match the invoice's currency (${inv.currency}).`, true);
    return;
  }
  if (editId) {
    const p = state.payments.find(p => p.id === editId);
    Object.assign(p, {
      date: data.date,
      amount: Number(data.amount),
      cryptoQty: data.cryptoQty
    });
    const amountUSD = usdEquivalent(p.amount, p.currency);
    updateJournalEntry(p.date, `Payment ${p.number} received`, [ {
      account: "cash",
      debit: amountUSD,
      credit: 0
    }, {
      account: "accounts_receivable",
      debit: 0,
      credit: amountUSD
    } ], "payment", p.id);
    logActivity(`Payment ${p.number} updated (${fmtAmount(p)})`);
    await saveState();
    closeModal();
    render();
    toast(`${p.number} updated`);
    return;
  }
  const number = nextReferenceNumber("PMT", state.payments, "number");
  const paymentId = uid();
  state.payments.push({
    id: paymentId,
    number: number,
    invoiceId: data.invoiceId,
    date: data.date,
    amount: Number(data.amount),
    currency: data.currency,
    cryptoQty: data.cryptoQty,
    isLateCharge: false
  });
  const amountUSD = usdEquivalent(data.amount, data.currency);
  postJournalEntry(data.date, `Payment ${number} received`, [ {
    account: "cash",
    debit: amountUSD,
    credit: 0
  }, {
    account: "accounts_receivable",
    debit: 0,
    credit: amountUSD
  } ], "payment", paymentId);
  logActivity(`Payment ${number} recorded (${fmt(data.amount, data.currency)})`);
  await saveState();
  closeModal();
  render();
  toast(`Payment ${number} recorded`);
}

async function addLateCharge(data, editId) {
  const inv = invoiceById(data.invoiceId);
  if (!inv) {
    toast("Invoice not found.", true);
    return;
  }
  if (inv.status === "cancelled") {
    toast("Cannot record a late charge against a cancelled invoice.", true);
    return;
  }
  const totalCharge = Number(data.totalCharge), actualCost = Number(data.actualCost);
  if (!Number.isFinite(totalCharge) || totalCharge < 0 || !Number.isFinite(actualCost) || actualCost < 0) {
    toast("Both amounts must be zero or positive numbers.", true);
    return;
  }
  const charitablePortion = Math.max(0, totalCharge - actualCost);
  if (editId) {
    const p = state.payments.find(p => p.id === editId);
    Object.assign(p, {
      date: data.date,
      amount: totalCharge,
      actualCost: actualCost,
      charitablePortion: charitablePortion
    });
    const totalUSD = usdEquivalent(totalCharge, inv.currency);
    const actualCostUSD = usdEquivalent(actualCost, inv.currency);
    const charitableUSD = usdEquivalent(charitablePortion, inv.currency);
    const lines = [ {
      account: "cash",
      debit: totalUSD,
      credit: 0
    }, {
      account: "revenue",
      debit: 0,
      credit: actualCostUSD
    } ];
    if (charitableUSD > .005) lines.push({
      account: "zakat_payable",
      debit: 0,
      credit: charitableUSD
    });
    updateJournalEntry(p.date, `Late charge ${p.number} collected`, lines, "payment", p.id);
    logActivity(`Late charge ${p.number} updated (${fmt(totalCharge, inv.currency)})`);
    await saveState();
    closeModal();
    render();
    toast(`${p.number} updated`);
    return;
  }
  const number = nextReferenceNumber("PMT", state.payments, "number");
  const lateChargeId = uid();
  state.payments.push({
    id: lateChargeId,
    number: number,
    invoiceId: data.invoiceId,
    date: data.date,
    amount: totalCharge,
    currency: inv.currency,
    isLateCharge: true,
    actualCost: actualCost,
    charitablePortion: charitablePortion,
    charitableDisbursed: false
  });
  const totalUSD = usdEquivalent(totalCharge, inv.currency);
  const actualCostUSD = usdEquivalent(actualCost, inv.currency);
  const charitableUSD = usdEquivalent(charitablePortion, inv.currency);
  const newLines = [ {
    account: "cash",
    debit: totalUSD,
    credit: 0
  }, {
    account: "revenue",
    debit: 0,
    credit: actualCostUSD
  } ];
  if (charitableUSD > .005) newLines.push({
    account: "zakat_payable",
    debit: 0,
    credit: charitableUSD
  });
  postJournalEntry(data.date, `Late charge ${number} collected`, newLines, "payment", lateChargeId);
  logActivity(`Late charge ${number} recorded (${fmt(totalCharge, inv.currency)}, ${fmt(charitablePortion, inv.currency)} charitable)`);
  await saveState();
  closeModal();
  render();
  toast(charitablePortion > 0 ? `${number} recorded. ${fmt(charitablePortion, inv.currency)} exceeds actual cost and must be donated to charity, not kept as income.` : `${number} recorded — matches documented actual cost.`);
}

async function markCharitableDisbursed(paymentId) {
  const p = state.payments.find(p => p.id === paymentId);
  if (!p) return;
  p.charitableDisbursed = !p.charitableDisbursed;
  p.charitableDisbursedDate = p.charitableDisbursed ? todayISO() : undefined;
  const charitableUSD = usdEquivalent(p.charitablePortion, p.currency);
  if (p.charitableDisbursed) {
    postJournalEntry(p.charitableDisbursedDate, `${p.number} charitable portion disbursed`, [ {
      account: "zakat_payable",
      debit: charitableUSD,
      credit: 0
    }, {
      account: "cash",
      debit: 0,
      credit: charitableUSD
    } ], "charitable-disbursement", p.id);
  } else {
    await removeJournalEntry("charitable-disbursement", p.id);
  }
  logActivity(`${p.number} charitable portion ${p.charitableDisbursed ? "marked disbursed" : "disbursed mark removed"} (${fmt(p.charitablePortion, p.currency)})`);
  await saveState();
  render();
  toast(p.charitableDisbursed ? "Marked as disbursed to charity" : "Disbursement mark removed");
}

async function submitZakatCalcModal() {
  const assets = Number(document.getElementById("f-assets").value);
  const rate = Number(document.getElementById("f-rate").value);
  const nisabUSD = Number(document.getElementById("f-nisab").value) || 0;
  if (!Number.isFinite(assets) || assets < 0) {
    toast("Assets must be zero or a positive number.", true);
    return;
  }
  if (!Number.isFinite(rate) || rate < 0 || rate > 1) {
    toast("Rate must be a decimal between 0 and 1 (e.g. 0.025 for 2.5%).", true);
    return;
  }
  if (nisabUSD < 0) {
    toast("Nisab threshold must be zero or a positive number.", true);
    return;

  state.zakatCalc = {
    assets: assets,
    rate: rate,
    currency: document.getElementById("f-currency").value,
    nisabUSD: nisabUSD
  };
  logActivity("Zakat calculation settings updated");
  await saveState();
  closeModal();
  render();
  toast("Zakatable assets updated");
}

function computeInsurancePolicies() {

    const latest = premiums[0] || null;
    let daysUntilRenewal = null, alertLevel = "none";
    if (latest) {
      daysUntilRenewal = Math.floor((new Date(latest.renewalDate) - new Date(today)) / 864e5);
      alertLevel = daysUntilRenewal < 0 ? "overdue" : daysUntilRenewal <= alertDays ? "due_soon" : "ok";
    }
    return Object.assign({}, policy, {
      premiums: premiums,
      latest: latest,
      daysUntilRenewal: daysUntilRenewal,
      alertLevel: alertLevel
    });
  });
}

const INHERITANCE_DEADLINE_ALERT_DAYS = 14;

function computeInheritanceCases() {
  const today = todayISO();
  return state.inheritanceCases.map(kase => {
    const steps = kase.steps || {};
    let totalSteps = 0, doneSteps = 0;
    for (const stage of INHERITANCE_STAGES) for (const s of stage.steps) {
      totalSteps++;
      if (steps[s.key] && steps[s.key].done) doneSteps++;
    }
    let daysUntilDeadline = null, deadlineAlertLevel = "none";
    if (kase.paymentDeadline) {
      daysUntilDeadline = Math.floor((new Date(kase.paymentDeadline) - new Date(today)) / 864e5);
      deadlineAlertLevel = daysUntilDeadline < 0 ? "overdue" : daysUntilDeadline <= INHERITANCE_DEADLINE_ALERT_DAYS ? "due_soon" : "ok";
    }
    return Object.assign({}, kase, {
      totalSteps: totalSteps,
      doneSteps: doneSteps,
      daysUntilDeadline: daysUntilDeadline,
      deadlineAlertLevel: deadlineAlertLevel
    });
  });
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader;
  reader.onload = async () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
    } catch (e) {
      toast("That file is not valid JSON — import cancelled.", true);
      event.target.value = "";
      return;
    }
    const requiredArrays = [ "clients", "invoices", "payments", "expenses", "zakatDisbursements" ];
    const missing = requiredArrays.filter(key => !Array.isArray(parsed[key]));
    const zc = parsed.zakatCalc;
    const zakatCalcValid = zc && typeof zc === "object" && typeof zc.assets === "number" && typeof zc.rate === "number" && typeof zc.currency === "string";
    if (missing.length || !zakatCalcValid) {
      toast(`This doesn't look like a valid export from this dashboard (missing or malformed: ${missing.join(", ") || "zakatCalc"}).`, true);
      event.target.value = "";
      return;
    }
    const summary = `${parsed.clients.length} clients, ${parsed.invoices.length} invoices, ${parsed.payments.length} payments, ${parsed.expenses.length} expenses, ${parsed.zakatDisbursements.length} Zakat disbursements`;
    if (!confirm(`Import this backup?\n\n${summary}\n\nThis REPLACES everything currently in this dashboard — it does not merge. This cannot be undone unless you have a separate backup of your current data.`)) {
      event.target.value = "";
      return;
    }
    state = migrateLegacyState(parsed);
    searchQuery = {
      clients: "",
      invoices: "",
      payments: "",
      expenses: ""
    };
    yearFilter = {
      invoices: "all",
      payments: "all",
      expenses: "all"
    };
    await saveState();
    event.target.value = "";
    render();
    toast("Backup imported successfully");
  };
  reader.onerror = () => toast("Could not read that file.", true);
  reader.readAsText(file);
}

function toCSV(rows, columns) {
  const escapeCell = v => {
    let s = String(v ?? "");
    if (typeof v === "string" && /^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const header = columns.map(c => c.label).join(",");
  const body = rows.map(r => columns.map(c => escapeCell(c.value(r))).join(",")).join("\n");
  return header + "\n" + body;
}

function downloadCSV(csvContent, filename) {
  const blob = new Blob([ csvContent ], {
    type: "text/csv"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  toast("CSV downloaded");
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true; else if (c === ",") {
      row.push(field);
      field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field);
      field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) {
    row.push(field);
    rows.push(row);
  }
  return rows;
}

function handleClientsCSVSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader;
  reader.onload = () => {
    let rows;
    try {
      rows = parseCSV(reader.result);
    } catch (e) {
      toast("Could not parse that CSV file.", true);
      event.target.value = "";
      return;
    }
    if (rows.length < 2) {
      toast("CSV needs a header row plus at least one data row.", true);
      event.target.value = "";
      return;
    }
    const header = rows[0].map(h => h.trim().toLowerCase());
    const nameIdx = header.indexOf("name");
    if (nameIdx === -1) {
      toast('CSV must have a "name" column.', true);
      event.target.value = "";
      return;
    }
    const emailIdx = header.indexOf("email"), typeIdx = header.indexOf("type"), tierIdx = header.indexOf("tier");
    const jurisdictionIdx = header.indexOf("jurisdiction"), currencyIdx = header.indexOf("currency");
    const validTiers = Object.keys(TIERS);
    const candidates = [];
    let skippedCount = 0;
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const name = (r[nameIdx] || "").trim();
      if (!name) {
        skippedCount++;
        continue;
      }
      const jurisdiction = jurisdictionIdx > -1 && (r[jurisdictionIdx] || "").trim().toLowerCase() === "qatar" ? "qatar" : "lebanon";
      const tierRaw = tierIdx > -1 ? (r[tierIdx] || "").trim() : "";
      const tier = validTiers.includes(tierRaw) ? tierRaw : "micro_startup";
      const type = typeIdx > -1 && (r[typeIdx] || "").trim().toLowerCase() === "individual" ? "individual" : "company";
      const currency = currencyIdx > -1 && (r[currencyIdx] || "").trim().toUpperCase() === "QAR" ? "QAR" : jurisdiction === "qatar" ? "QAR" : "USD";
      const email = emailIdx > -1 ? (r[emailIdx] || "").trim() : "";
      candidates.push({
        name: name,
        email: email,
        type: type,
        tier: tier,
        jurisdiction: jurisdiction,
        currency: currency
      });
    }
    window.__pendingClientImport = candidates;
    openClientsCSVPreviewModal(candidates, skippedCount);
    event.target.value = "";
  };
  reader.onerror = () => toast("Could not read that file.", true);
  reader.readAsText(file);
}

function computeActionItems() {
  const items = [];
  const invoices = computeInvoices();
  const pendingInvoiceConsent = invoices.filter(i => i.status !== "cancelled" && requiresJointConsent(i.amount, i.currency) && !i.consentConfirmed);
  const pendingExpenseConsent = state.expenses.filter(e => requiresJointConsent(e.amount, e.currency) && !e.consentConfirmed);
  const pendingZakatConsent = state.zakatDisbursements.filter(d => requiresJointConsent(d.amount, d.currency) && !d.consentConfirmed);
  const overdueInvoices = invoices.filter(i => i.status === "overdue");
  const comingDue = computeComingDue(7);
  const undisbursedCharitable = state.payments.filter(p => p.isLateCharge && p.charitablePortion > 0 && !p.charitableDisbursed);
  const bs = computeBalanceSheet();
  const bsImbalanced = Math.abs(bs.differenceUSD) >= .01;
  const daysSinceExport = state.settings.lastExportedAt ? Math.floor((Date.now() - new Date(state.settings.lastExportedAt).getTime()) / 864e5) : null;
  const backupStale = daysSinceExport === null || daysSinceExport > 14;
  const lastCheckpoint = state.integrityCheckpoints.length ? state.integrityCheckpoints[state.integrityCheckpoints.length - 1] : null;
  const daysSinceCheckpoint = lastCheckpoint ? Math.floor((Date.now() - new Date(lastCheckpoint.at).getTime()) / 864e5) : null;
  const checkpointStale = daysSinceCheckpoint === null || daysSinceCheckpoint > 30;
  const insurancePolicies = computeInsurancePolicies();
  const overdueInsurance = insurancePolicies.filter(p => p.alertLevel === "overdue");
  const dueSoonInsurance = insurancePolicies.filter(p => p.alertLevel === "due_soon");
  const inheritanceCases = computeInheritanceCases();
  const overdueInheritance = inheritanceCases.filter(k => k.deadlineAlertLevel === "overdue");
  const dueSoonInheritance = inheritanceCases.filter(k => k.deadlineAlertLevel === "due_soon");
  if (pendingInvoiceConsent.length) items.push({
    severity: "high",
    text: `${pendingInvoiceConsent.length} invoice(s) over USD 15,000 awaiting joint consent`,
    tab: "invoices"
  });
  if (pendingExpenseConsent.length) items.push({
    severity: "high",
    text: `${pendingExpenseConsent.length} expense(s) over USD 15,000 awaiting joint consent`,
    tab: "expenses"
  });
  if (pendingZakatConsent.length) items.push({
    severity: "high",
    text: `${pendingZakatConsent.length} Zakat disbursement(s) over USD 15,000 awaiting joint consent`,
    tab: "zakat"
  });
  if (overdueInvoices.length) items.push({
    severity: "high",
    text: `${overdueInvoices.length} invoice(s) overdue, totaling ${fmt(overdueInvoices.reduce((s, i) => s + usdEquivalent(i.balance, i.currency), 0), "USD")}`,
    tab: "invoices"
  });
  if (overdueInsurance.length) items.push({
    severity: "high",
    text: `${overdueInsurance.length} insurance polic${overdueInsurance.length === 1 ? "y" : "ies"} past its renewal date`,
    tab: "insurance"
  });
  if (dueSoonInsurance.length) items.push({
    severity: "medium",
    text: `${dueSoonInsurance.length} insurance polic${dueSoonInsurance.length === 1 ? "y" : "ies"} renewing within ${state.settings.insuranceAlertDays} days`,
    tab: "insurance"
  });
  if (overdueInheritance.length) items.push({
    severity: "high",
    text: `${overdueInheritance.length} inheritance case(s) past their payment deadline`,
    tab: "inheritance"
  });
  if (dueSoonInheritance.length) items.push({
    severity: "medium",
    text: `${dueSoonInheritance.length} inheritance case(s) with a payment deadline within ${INHERITANCE_DEADLINE_ALERT_DAYS} days`,
    tab: "inheritance"
  });
  if (comingDue.length) items.push({
    severity: "medium",
    text: `${comingDue.length} invoice(s) due within 7 days`,
    tab: "invoices"
  });
  if (undisbursedCharitable.length) items.push({
    severity: "medium",
    text: `${undisbursedCharitable.length} charitable obligation(s) from late charges not yet disbursed`,
    tab: "payments"
  });
  if (bsImbalanced) items.push({
    severity: "medium",
    text: `Balance Sheet is out of balance by ${fmt(Math.abs(bs.differenceUSD), "USD")}`,
    tab: "balance-sheet"

    severity: "low",
    text: daysSinceExport === null ? "No backup has ever been exported" : `Last backup was ${daysSinceExport} day(s) ago`,

  if (checkpointStale) items.push({

    text: lastCheckpoint ? `Last integrity checkpoint was ${daysSinceCheckpoint} day(s) ago — generate and share a fresh one` : "No integrity checkpoint has ever been generated",

  return items;
}

const TREND_MONTHS = 12;

function localISODate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function computeMonthlyTrend(months) {
  const now = new Date;
  const buckets = [];
  for (let i = months - 1; i >= 0; i--) {
    const start = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const end = new Date(now.getFullYear(), now.getMonth() - i + 1, 0);
    const startISO = localISODate(start);
    const endISO = localISODate(end);
    const pl = computeProfitLoss(startISO, endISO);
    buckets.push({
      label: start.toLocaleDateString(undefined, {
        month: "short",
        year: "2-digit"
      }),
      revenueUSD: pl.totalRevenueUSD,
      expenseUSD: pl.totalExpensesUSD
    });
  }
  return buckets;
}

function computeCashBalanceTrend(months) {
  const now = new Date;
  const points = [];
  for (let i = months - 1; i >= 0; i--) {
    const end = new Date(now.getFullYear(), now.getMonth() - i + 1, 0);
    const cutoff = localISODate(end);
    let balance = 0;
    for (const e of state.journalEntries) {
      if (e.date > cutoff) continue;
      for (const l of e.lines) if (l.account === "cash") balance += (l.debit || 0) - (l.credit || 0);
    }
    points.push({
      label: end.toLocaleDateString(undefined, {
        month: "short",
        year: "2-digit"
      }),
      balanceUSD: balance
    });
  }
  return points;
}

function monthlyTrendChartSVG(buckets) {
  const W = 640, H = 210, padL = 10, padR = 10, padT = 10, padB = 24;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxVal = Math.max(1, ...buckets.map(b => Math.max(b.revenueUSD, b.expenseUSD)));
  const n = buckets.length;
  const groupW = innerW / n;
  const barW = Math.max(2, groupW * .32);
  const bars = buckets.map((b, i) => {
    const x0 = padL + i * groupW + groupW * .12;
    const revH = b.revenueUSD / maxVal * innerH;
    const expH = b.expenseUSD / maxVal * innerH;
    const xRev = x0, xExp = x0 + barW + 3;
    return `<rect x="${xRev.toFixed(1)}" y="${(padT + innerH - revH).toFixed(1)}" width="${barW.toFixed(1)}" height="${revH.toFixed(1)}" fill="#2A6F3F"><title>${esc(b.label)} Revenue: ${fmt(b.revenueUSD, "USD")}</title></rect>` + `<rect x="${xExp.toFixed(1)}" y="${(padT + innerH - expH).toFixed(1)}" width="${barW.toFixed(1)}" height="${expH.toFixed(1)}" fill="#B23B3B"><title>${esc(b.label)} Expenses: ${fmt(b.expenseUSD, "USD")}</title></rect>`;
  }).join("");
  const labelStep = n > 8 ? 2 : 1;
  const labels = buckets.map((b, i) => i % labelStep !== 0 && i !== n - 1 ? "" : `<text x="${(padL + i * groupW + groupW / 2).toFixed(1)}" y="${H - 6}" font-size="9" text-anchor="middle" fill="#6B7280">${esc(b.label)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet">\n    <line x1="${padL}" y1="${padT + innerH}" x2="${W - padR}" y2="${padT + innerH}" stroke="#E5E7EB" />\n    ${bars}${labels}\n  </svg>`;
}

function cashTrendChartSVG(points) {
  const W = 640, H = 170, padL = 10, padR = 10, padT = 14, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const values = points.map(p => p.balanceUSD);
  const maxVal = Math.max(1, ...values), minVal = Math.min(0, ...values);
  const range = maxVal - minVal || 1;
  const n = points.length;
  const stepX = n > 1 ? innerW / (n - 1) : 0;
  const coords = points.map((p, i) => [ padL + i * stepX, padT + innerH - (p.balanceUSD - minVal) / range * innerH ]);
  const path = coords.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const zeroY = padT + innerH - (0 - minVal) / range * innerH;
  const dots = coords.map(([x, y], i) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${NAVY}"><title>${esc(points[i].label)}: ${fmt(points[i].balanceUSD, "USD")}</title></circle>`).join("");
  const labelStep = n > 8 ? 2 : 1;
  const labels = points.map((p, i) => i % labelStep !== 0 && i !== n - 1 ? "" : `<text x="${(padL + i * stepX).toFixed(1)}" y="${H - 6}" font-size="9" text-anchor="middle" fill="#6B7280">${esc(p.label)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet">\n    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W - padR}" y2="${zeroY.toFixed(1)}" stroke="#E5E7EB" />\n    <path d="${path}" fill="none" stroke="${NAVY_LIGHT}" stroke-width="2" />\n    ${dots}${labels}\n  </svg>`;
}

const FIAT_DISPLAY_CURRENCIES = [ "USD", "QAR", "LBP" ];

function renderOverview() {
  const invoices = computeInvoices();
  const revenueByCurrency = {
    USD: 0,
    QAR: 0,
    LBP: 0
  };
  const outstandingByCurrency = {
    USD: 0,
    QAR: 0,
    LBP: 0
  };
  for (const inv of invoices) {
    const bucket = FIAT_DISPLAY_CURRENCIES.includes(inv.currency) ? inv.currency : "USD";
    revenueByCurrency[bucket] += inv.paid;
    outstandingByCurrency[bucket] += inv.balance;
  }
  const expensesByCurrency = {
    USD: 0,
    QAR: 0,
    LBP: 0
  };
  for (const e of state.expenses) {
    const bucket = FIAT_DISPLAY_CURRENCIES.includes(e.currency) ? e.currency : "USD";
    expensesByCurrency[bucket] += e.amount;
  }
  const totalExpensesUSD = FIAT_DISPLAY_CURRENCIES.reduce((s, c) => s + usdEquivalent(expensesByCurrency[c], c), 0);
  const netIncomeUSD = computeProfitLoss(null, null).netIncomeUSD;
  const revByCategory = {};
  for (const inv of invoices) {
    const paidInUSD = usdEquivalent(inv.paid, inv.currency);
    revByCategory[inv.category] = (revByCategory[inv.category] || 0) + paidInUSD;
  }
  const maxRev = Math.max(1, ...Object.values(revByCategory));
  const buckets = {
    Current: 0,
    "1–30d": 0,
    "31–60d": 0,
    "61–90d": 0,
    "90d+": 0
  };
  const today = new Date(todayISO());
  for (const inv of invoices) {
    if (inv.balance <= 0 || inv.status === "cancelled") continue;
    const balanceInUSD = usdEquivalent(inv.balance, inv.currency);
    const days = Math.floor((today - new Date(inv.dueDate)) / 864e5);
    if (days <= 0) buckets["Current"] += balanceInUSD; else if (days <= 30) buckets["1–30d"] += balanceInUSD; else if (days <= 60) buckets["31–60d"] += balanceInUSD; else if (days <= 90) buckets["61–90d"] += balanceInUSD; else buckets["90d+"] += balanceInUSD;
  }
  const maxAging = Math.max(1, ...Object.values(buckets));
  const recent = [ ...invoices ].sort((a, b) => new Date(b.issueDate) - new Date(a.issueDate)).slice(0, 5);
  return `\n    <div class="view-header"><div><h2>Overview</h2><p>Live figures from clients, invoices, and payments on file</p></div></div>\n    ${renderActionItems()}\n    <div class="stat-grid">\n      ${FIAT_DISPLAY_CURRENCIES.map(cur => {
    const revSub = cur === "USD" ? "Lebanon (USD) engagements" : cur === "QAR" ? `Qatar engagements · ≈ ${fmt(usdEquivalent(revenueByCurrency[cur], cur), "USD")}` : `Lebanon (LBP) engagements · ≈ ${fmt(usdEquivalent(revenueByCurrency[cur], cur), "USD")}`;
    return `<div class="stat-card"><div class="label">Revenue Collected (${cur})</div><div class="value">${fmt(revenueByCurrency[cur], cur)}</div><div class="sub">${revSub}</div></div>`;
  }).join("")}\n      ${FIAT_DISPLAY_CURRENCIES.map(cur => `<div class="stat-card"><div class="label">Outstanding (${cur})</div><div class="value">${fmt(outstandingByCurrency[cur], cur)}</div><div class="sub">Unpaid balance</div></div>`).join("")}\n      <div class="stat-card"><div class="label">Expenses (USD-equivalent)</div><div class="value">${fmt(totalExpensesUSD, "USD")}</div><div class="sub">${FIAT_DISPLAY_CURRENCIES.map(cur => fmt(expensesByCurrency[cur], cur)).join(" + ")} converted</div></div>\n      <div class="stat-card"><div class="label">Net Income (USD)</div><div class="value" style="color:${netIncomeUSD >= 0 ? "#2A6F3F" : "#B23B3B"};">${fmt(netIncomeUSD, "USD")}</div><div class="sub">Accrual basis, net of VAT — all time. Same figure as the Income Statement report.</div></div>\n    </div>\n    <div class="note-box" style="margin-top:-8px;">Net Income consolidates USD, QAR, and LBP activity into one figure — QAR and LBP revenue/expenses are converted at their editable rates (QAR/USD peg ${state.settings.qarPerUsd}, LBP/USD rate ${state.settings.lbpPerUsd.toLocaleString()} — both on the Settings tab) before netting, the same rates used for the Zakat and joint-consent thresholds elsewhere in this app.</div>\n    <div class="two-col-grid">\n      <div class="card">\n        <h3>Revenue by Service Category (USD-equivalent)</h3>\n        ${Object.keys(revByCategory).length ? `<div class="bar-chart">\n          ${Object.entries(revByCategory).map(([key, val]) => `\n            <div class="bar-row">\n              <span>${categoryLabel(key)}</span>\n              <div class="bar-track"><div class="bar-fill" style="width:${val / maxRev * 100}%;background:${categoryColor(key)};"></div></div>\n              <span class="right">${fmt(val, "USD")}</span>\n            </div>`).join("")}\n        </div>` : '<p class="empty">No revenue recorded yet.</p>'}\n      </div>\n      <div class="card">\n        <h3>Receivables Aging (USD-equivalent)</h3>\n        <div class="bar-chart">\n          ${Object.entries(buckets).map(([name, val], i) => `\n            <div class="bar-row">\n              <span>${name}</span>\n              <div class="bar-track"><div class="bar-fill" style="width:${val / maxAging * 100}%;background:${i >= 3 ? "#B23B3B" : i === 2 ? "#A9720A" : NAVY_LIGHT};"></div></div>\n              <span class="right">${fmt(val, "USD")}</span>\n            </div>`).join("")}\n        </div>\n      </div>\n    </div>\n    <div class="two-col-grid">\n      <div class="card">\n        <h3>Monthly Revenue vs. Expenses (USD-equivalent, last ${TREND_MONTHS} months)</h3>\n        ${monthlyTrendChartSVG(computeMonthlyTrend(TREND_MONTHS))}\n        <div style="display:flex;gap:16px;font-size:11.5px;color:#6B7280;margin-top:6px;">\n          <span><span style="display:inline-block;width:9px;height:9px;background:#2A6F3F;border-radius:2px;margin-right:5px;"></span>Revenue</span>\n          <span><span style="display:inline-block;width:9px;height:9px;background:#B23B3B;border-radius:2px;margin-right:5px;"></span>Expenses</span>\n        </div>\n      </div>\n      <div class="card">\n        <h3>Cash Balance Trend (last ${TREND_MONTHS} months)</h3>\n        ${cashTrendChartSVG(computeCashBalanceTrend(TREND_MONTHS))}\n        <p style="font-size:11px;color:#6B7280;margin:6px 0 0;">Month-end Cash &amp; Bank balance, straight from the General Ledger.</p>\n      </div>\n    </div>\n    <div class="card">\n      <h3>Recent Invoices</h3>\n      <table><thead><tr><th>Invoice</th><th>Client</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead>\n      <tbody>${recent.map(inv => `<tr><td class="mono">${esc(inv.number)}</td><td>${esc(clientById(inv.clientId)?.name || "—")}</td><td>${categoryLabel(inv.category)}</td><td class="right">${fmtAmount(inv)}</td><td><span class="badge badge-${inv.status}">${inv.status.replace("_", " ")}</span></td></tr>`).join("")}</tbody></table>\n    </div>\n  `;
}

async function deleteClient(id) {
  const hasInvoices = state.invoices.some(inv => inv.clientId === id);
  if (hasInvoices) {
    toast("Cannot delete a client with existing invoices. Delete or reassign those invoices first.", true);
    return;
  }
  if (!confirm("Delete this client?")) return;
  const client = state.clients.find(c => c.id === id);
  state.clients = state.clients.filter(c => c.id !== id);
  await supabaseDelete("clients", id);
  logActivity(`Client "${client?.name}" deleted`);
  await saveState();
  render();
  toast("Client deleted");
}

function openExpenseDuplicateModal(sourceId) {
  const e = state.expenses.find(e => e.id === sourceId);
  if (!e) return;
  document.getElementById("modalRoot").innerHTML = `\n    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">\n      <div class="modal">\n        <div class="modal-header"><h3>Repeat Expense ${esc(e.number)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>\n        <div class="note-box">Creates a new expense with the same category, description, vendor, and amount (${fmtAmount(e)}) — useful for a recurring monthly cost like rent or a subscription.</div>\n        <input type="hidden" id="f-source-id" value="${sourceId}" />\n        <div class="form-group"><label>Repeat Interval</label>\n          <select id="f-interval">\n            <option value="1month">Monthly (+1 month)</option>\n            <option value="3month">Quarterly (+3 months)</option>\n            <option value="custom">Custom (days)</option>\n          </select>\n        </div>\n        <div class="form-group hidden" id="f-custom-days-group"><label>Days to add</label><input type="number" min="1" id="f-custom-days" value="30" /></div>\n        <button class="btn btn-navy" style="width:100%;" onclick="submitExpenseDuplicateModal()">Create Next Expense</button>\n      </div>\n    </div>`;
  document.getElementById("f-interval").addEventListener("change", ev => {
    document.getElementById("f-custom-days-group").classList.toggle("hidden", ev.target.value !== "custom");
  });
}

async function submitExpenseDuplicateModal() {
  const sourceId = document.getElementById("f-source-id").value;
  const e = state.expenses.find(e => e.id === sourceId);
  if (!e) {
    toast("Source expense not found.", true);
    return;
  }
  const interval = document.getElementById("f-interval").value;
  let newDate;
  if (interval === "1month") newDate = addMonths(e.date, 1); else if (interval === "3month") newDate = addMonths(e.date, 3); else {
    const days = Number(document.getElementById("f-custom-days").value) || 30;
    newDate = addDays(e.date, days);
  }
  await addExpense({
    date: newDate,
    category: e.category,
    description: e.description,
    vendor: e.vendor,
    amount: e.amount,
    currency: e.currency,
    cryptoQty: e.cryptoQty
  });
}

}\n          </td></tr>` : ""}\n        `).join("")}</tbody>\n      </table>` : `<p class="empty">No insurance policies yet — add one, then log its first premium/renewal.</p>`}\n    </div>\n  `;

  return `\n    <div class="view-header"><div><h2>Inheritance</h2><p>Lebanon inheritance paperwork — document checklist and progress tracking</p></div>\n      <button class="btn btn-gold" onclick="openInheritanceCaseModal()">+ New Case</button></div>\n    <div class="note-box">Recording only — tracks progress through the inheritance-paperwork process for reference. Nothing here posts to the General Ledger or affects the Balance Sheet, Income Statement, or Cash Flow Statement. If a fee is actually paid (e.g. the inheritance tax), record it as an Expense instead.</div>\n    ${alerts.length ? `<div class="card" style="border-left:4px solid #B23B3B;">\n      <h3 style="color:#B23B3B;">Payment Deadlines Needing Attention</h3>\n      <div style="display:flex;flex-direction:column;gap:8px;">\n        ${alerts.map(k => `\n          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-left:3px solid ${statusMeta[k.deadlineAlertLevel].color};background:#F7F5F1;border-radius:4px;flex-wrap:wrap;gap:8px;">\n            <span style="font-size:13px;">${esc(k.deceasedName)} — ${k.deadlineAlertLevel === "overdue" ? `payment deadline passed ${Math.abs(k.daysUntilDeadline)} day(s) ago` : `payment due in ${k.daysUntilDeadline} day(s)`} (${esc(k.paymentDeadline)}) — the guide notes extra fees apply once the deadline passes</span>\n            <button class="btn-outline" onclick="openInheritanceCaseModal('${k.id}')">Edit Deadline</button>\n          </div>`).join("")}\n      </div>\n    </div>` : ""}\n    ${cases.length ? cases.map(k => `\n      <div class="card">\n        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">\n          <div>\n            <h3 style="margin-bottom:2px;">${esc(k.deceasedName)} <span style="font-size:11px;color:#6B7280;font-weight:400;">${esc(k.number)}</span></h3>\n            ${k.heirs ? `<p style="font-size:12px;color:#6B7280;margin:0 0 4px;">Heirs: ${esc(k.heirs)}</p>` : ""}\n            ${k.powerOfAttorney ? `<p style="font-size:12px;color:#6B7280;margin:0 0 4px;">Power of attorney: ${esc(k.powerOfAttorney)}</p>` : ""}\n            <p style="font-size:12px;margin:0 0 4px;">${k.doneSteps} / ${k.totalSteps} steps complete${k.paymentDeadline ? ` · Payment deadline ${esc(k.paymentDeadline)} <span class="badge" style="background:${statusMeta[k.deadlineAlertLevel].color}22;color:${statusMeta[k.deadlineAlertLevel].color};">${statusMeta[k.deadlineAlertLevel].label}</span>` : ""}</p>\n            ${k.notes ? `<p style="font-size:12px;color:#6B7280;margin:0;">${esc(k.notes)}</p>` : ""}\n          </div>\n          <div style="white-space:nowrap;">\n            <button class="btn-outline" onclick="toggleInheritanceCase('${k.id}')">${expandedInheritanceCase === k.id ? "Hide Checklist" : "View Checklist"}</button>\n            <button class="btn-outline" onclick="openInheritanceCaseModal('${k.id}')">Edit</button>\n            <button class="btn-outline" onclick="deleteInheritanceCase('${k.id}')">Delete</button>\n          </div>\n        </div>\n        ${expandedInheritanceCase === k.id ? INHERITANCE_STAGES.map(stage => `\n          <div style="margin-top:14px;">\n            <h4 style="margin:0 0 2px;">Stage ${stage.stage}: ${esc(stage.title)}</h4>\n            ${stage.note ? `<p style="font-size:11px;color:#6B7280;margin:0 0 6px;">${esc(stage.note)}</p>` : ""}\n            <table style="margin:0;">\n              <thead><tr><th>Document / Step</th><th>Status</th><th>Date</th><th>Notes</th><th></th></tr></thead>\n              <tbody>${stage.steps.map(s => {
    const step = Object.assign({

function renderActivityLog() {
  const entries = [ ...state.activityLog ].reverse();
  const v = activityLogVerification;
  const stale = v && v.count !== state.activityLog.length;
  return `\n    <div class="view-header"><div><h2>Activity Log</h2><p>What changed and when — the last ${ACTIVITY_LOG_MAX} actions across this dashboard</p></div>\n      <button class="btn btn-gold" onclick="verifyActivityLogChain()">Verify Chain Integrity</button></div>\n    <div class="note-box">"Who" here is self-attested, not authenticated — this dashboard has no login or user accounts, so anyone with access to the file could pick any name from "Acting As" (sidebar) before taking an action, or none at all. Combined with the hash chain below (which covers the "who" field too) and the segregation-of-duties check on joint-consent confirmations, this deters an honest mistake and makes a false attribution provable after the fact — it does not stop a determined person with full access from lying about who they are.</div>\n    <div class="note-box">Every entry is hash-chained to the one before it (like a git history) — editing, reordering, or deleting a past entry in the saved file breaks every hash after it. "Verify Chain Integrity" recomputes the whole chain and reports whether it's still intact. This doesn't stop someone with full access to the file from editing an entry AND recomputing every hash after it to cover their tracks — it defeats a casual or partial edit, not a determined one with full access.</div>\n    ${v ? `<div class="card" style="border-left:4px solid ${v.ok ? "#2A6F3F" : "#B23B3B"};">\n      <h3 style="color:${v.ok ? "#2A6F3F" : "#B23B3B"};">${v.ok ? "✓ Chain Verified Intact" : "✗ Tamper Detected"}</h3>\n      <p style="font-size:13px;margin:0;">${v.ok ? `All ${v.count} entries check out — each entry's hash matches its recorded content and links correctly to the one before it.` : `Entry #${v.brokenIndex + 1} (of ${v.count}, chronological order) does not match its recorded hash or its link to the previous entry — something in the saved log was changed after it was written.`}</p>\n      <p style="font-size:11px;color:#6B7280;margin:8px 0 0;">Checked ${esc(new Date(v.checkedAt).toLocaleString())}${stale ? " — the log has changed since this check; verify again for a current result." : ""}</p>\n    </div>` : ""}\n    <div class="card">\n      <h3>Integrity Checkpoints</h3>\n      <p style="font-size:12.5px;color:#6B7280;margin:0 0 14px;">A fingerprint of every client, invoice, payment, expense, Zakat disbursement, cash-flow entry, balance sheet account, and journal entry on file, plus this Activity Log's own chain tip. Generate one whenever it matters — end of month, before an audit, after a big change — and get it OFF this device (email it, write it down). A fingerprint that only lives in this file's own storage proves nothing, since whoever can edit the data can edit the fingerprint too; its value comes entirely from existing somewhere this copy doesn't control, like an independent copy the other Managing Partner holds.</p>\n      <button class="btn btn-gold" onclick="openGenerateCheckpointModal()">+ Generate Checkpoint</button>\n      ${state.integrityCheckpoints.length ? `<table style="margin-top:16px;">\n        <thead><tr><th>When</th><th>Fingerprint</th><th>Note</th><th></th></tr></thead>\n        <tbody>${[ ...state.integrityCheckpoints ].reverse().map(cp => `<tr>\n          <td class="mono" style="white-space:nowrap;">${esc(new Date(cp.at).toLocaleString())}</td>\n          <td class="mono" style="font-size:11px;" title="${esc(cp.fingerprint)}">${esc(formatFingerprint(cp.fingerprint))}</td>\n          <td>${esc(cp.note || "—")}</td>\n          <td style="white-space:nowrap;">\n            <button class="btn-outline" data-fp="${esc(formatFingerprint(cp.fingerprint))}" onclick="copyToClipboard(this.dataset.fp)">Copy</button>\n            <button class="btn-outline" onclick="openEmailCheckpointModal('${cp.id}')">Email</button>\n            <button class="btn-outline" onclick="deleteIntegrityCheckpoint('${cp.id}')">Delete</button>\n          </td>\n        </tr>`).join("")}</tbody>\n      </table>` : '<p class="empty" style="margin-top:14px;">No checkpoints generated yet.</p>'}\n    </div>\n    <div class="card">\n      <h3>Compare a Checkpoint</h3>\n      <p style="font-size:12.5px;color:#6B7280;margin:0 0 14px;">Paste in a fingerprint you received (email, note, text message) to check whether it matches what this copy currently computes.</p>\n      <div class="form-group"><label>Fingerprint</label><input id="f-checkpoint-compare" placeholder="Paste the fingerprint here (with or without dashes)" /></div>\n      <button class="btn btn-navy" onclick="compareIntegrityCheckpoint(document.getElementById('f-checkpoint-compare').value)">Compare to Current</button>\n      ${checkpointCompareResult ? `<div class="note-box" style="margin-top:14px;background:${checkpointCompareResult.match ? "#E5F3E9" : "#FBE7E7"};border-left-color:${checkpointCompareResult.match ? "#2A6F3F" : "#B23B3B"};color:${checkpointCompareResult.match ? "#1D4E2C" : "#7A2424"};">\n        ${checkpointCompareResult.match ? "✓ Matches — this copy's current data is identical to whatever produced that fingerprint." : "✗ Does not match — something differs between this copy and whatever produced that fingerprint. Expected if legitimate activity happened since (new invoices, payments, etc.); generate a fresh checkpoint on both copies at the same moment to tell that apart from something more concerning."}\n        <br><span style="font-size:10.5px;">Checked ${esc(new Date(checkpointCompareResult.checkedAt).toLocaleString())}</span>\n      </div>` : ""}\n    </div>\n    <div class="card">\n      ${entries.length ? `<table>\n        <thead><tr><th>When</th><th>Who</th><th>What</th><th title="First 8 characters of this entry's SHA-256 chain hash">Hash</th></tr></thead>\n        <tbody>${entries.map(e => `<tr><td class="mono" style="white-space:nowrap;">${esc(new Date(e.at).toLocaleString())}</td><td>${e.by ? esc(e.by) : '<span style="color:#6B7280;">—</span>'}</td><td>${esc(e.text)}</td><td class="mono" style="color:#6B7280;" title="${esc(e.hash || "not yet chained")}">${e.hash ? esc(e.hash.slice(0, 8)) : "—"}</td></tr>`).join("")}</tbody>\n      </table>` : '<p class="empty">No activity recorded yet.</p>'}\n    </div>\n  `;
}

function renderSettings() {
  const cats = state.settings.serviceCategories;
  return `\n    <div class="view-header"><div><h2>Settings</h2><p>Currency peg, backup status, and Schedule B service categories &amp; rate card</p></div></div>\n    <div class="card">\n      <h3>Currency</h3>\n      <div class="form-row">\n        <div class="form-group"><label>QAR / USD Peg Rate</label><input type="number" min="0.0001" step="0.0001" id="f-qar-rate" value="${state.settings.qarPerUsd}" /></div>\n        <div class="form-group"><label>LBP / USD Rate</label><input type="number" min="0.0001" step="1" id="f-lbp-rate" value="${state.settings.lbpPerUsd}" /></div>\n      </div>\n      <button class="btn btn-navy" onclick="updateQarRate(Number(document.getElementById('f-qar-rate').value)); updateLbpRate(Number(document.getElementById('f-lbp-rate').value));">Save Rates</button>\n      <p style="font-size:11px;color:#6B7280;margin-top:10px;">Used everywhere this app converts QAR/LBP to/from USD — Overview, Net Income, the USD 15,000 joint-consent threshold, Zakat, and every report. QAR is a genuinely fixed peg; LBP has had no stable rate since 2019 and needs checking and updating manually on whatever cadence actually matches how you keep your books.</p>\n    </div>\n    <div class="card">\n      <h3>VAT</h3>\n      <div class="form-group" style="max-width:240px;"><label>VAT Rate (%)</label><input type="number" min="0" max="100" step="0.1" id="f-vat-rate" value="${state.settings.vatRatePercent}" /></div>\n      <button class="btn btn-navy" onclick="updateVatRate(Number(document.getElementById('f-vat-rate').value))">Save Rate</button>\n      <p style="font-size:11px;color:#6B7280;margin-top:10px;">Default VAT rate applied to new invoices (output VAT) and expenses (input VAT) — confirm the current legal rate with your accountant. Editable per invoice/expense if a specific transaction needs a different rate or no VAT at all.</p>\n    </div>\n    <div class="card">\n      <h3>Backup</h3>\n      <p style="font-size:13px;margin:0 0 12px;">Last exported: <strong>${state.settings.lastExportedAt ? new Date(state.settings.lastExportedAt).toLocaleString() : "Never"}</strong></p>\n      <button class="btn-outline" style="padding:9px 16px;font-size:13px;" onclick="exportJSON()">⭳ Export Now</button>\n      <p style="font-size:11px;color:#6B7280;margin-top:10px;">${SUPABASE_ENABLED ? `Data lives in the shared Supabase database, not this browser — this export is a manual point-in-time snapshot (useful before a big change, or just as an extra copy), not the only backup that exists.` : `Export/Import is the only real backup this dashboard has — everything else lives only in this browser's local storage.`}</p>\n    </div>\n    <div class="card">\n      <h3>Security</h3>\n      ${SUPABASE_ENABLED ? `\n      <div class="form-group" style="max-width:280px;"><label>Auto-Sign-Out After Inactivity</label>\n        <select id="f-autolock-minutes">\n          <option value="0" ${state.settings.autoLockMinutes === 0 ? "selected" : ""}>Never</option>\n          <option value="5" ${state.settings.autoLockMinutes === 5 ? "selected" : ""}>5 minutes</option>\n          <option value="15" ${state.settings.autoLockMinutes === 15 ? "selected" : ""}>15 minutes</option>\n          <option value="30" ${state.settings.autoLockMinutes === 30 ? "selected" : ""}>30 minutes</option>\n          <option value="60" ${state.settings.autoLockMinutes === 60 ? "selected" : ""}>60 minutes</option>\n        </select>\n      </div>\n      <button class="btn btn-navy" onclick="updateAutoLockMinutes(Number(document.getElementById('f-autolock-minutes').value))">Save</button>\n      <p style="font-size:11px;color:#6B7280;margin-top:10px;">Signs this session out after this much time with no mouse, keyboard, or touch activity — protects an unattended, signed-in device. Use "Sign Out" in the sidebar to end the session immediately instead of waiting.</p>\n      ` : `\n      <div class="form-group" style="max-width:280px;"><label>Auto-Lock After Inactivity</label>\n        <select id="f-autolock-minutes">\n          <option value="0" ${state.settings.autoLockMinutes === 0 ? "selected" : ""}>Never</option>\n          <option value="5" ${state.settings.autoLockMinutes === 5 ? "selected" : ""}>5 minutes</option>\n          <option value="15" ${state.settings.autoLockMinutes === 15 ? "selected" : ""}>15 minutes</option>\n          <option value="30" ${state.settings.autoLockMinutes === 30 ? "selected" : ""}>30 minutes</option>\n          <option value="60" ${state.settings.autoLockMinutes === 60 ? "selected" : ""}>60 minutes</option>\n        </select>\n      </div>\n      <button class="btn btn-navy" onclick="updateAutoLockMinutes(Number(document.getElementById('f-autolock-minutes').value))">Save</button>\n      <p style="font-size:11px;color:#6B7280;margin-top:10px;">${encryptionPassphrase ? `Clears the passphrase from memory and re-locks this dashboard after this much time with no mouse, keyboard, or touch activity — protects an unattended, unlocked device. Use "Lock Now" in the sidebar to lock immediately instead of waiting.` : `Only applies once this dashboard is encrypted — see "Encryption Settings" in the sidebar. With no encryption enabled, there's no passphrase in memory to protect.`}</p>\n      `}\n    </div>\n    <div class="card">\n      <h3>Insurance Alerts</h3>\n      <div class="form-group" style="max-width:280px;"><label>Alert Window (days before renewal)</label><input type="number" min="0" step="1" id="f-insurance-alert-days" value="${state.settings.insuranceAlertDays}" /></div>\n      <button class="btn btn-navy" onclick="updateInsuranceAlertDays(Number(document.getElementById('f-insurance-alert-days').value))">Save</button>\n      <p style="font-size:11px;color:#6B7280;margin-top:10px;">How many days before a policy's next renewal date it starts showing as "Due Soon" on the Insurance tab and in Action Items on Overview.</p>\n    </div>\n    ${SUPABASE_ENABLED ? `\n    <div class="card">\n      <h3>Internal Controls — Authorized Users</h3>\n      <p style="font-size:12.5px;color:#6B7280;margin:0;">Who can access this dashboard, and the name attached to their actions, is managed outside the app now — see <code>supabase/README.md</code> ("Invite each authorized person" / "Add each of them to profiles"). Authentication is real (a password, not a picker), so there's nothing to configure here anymore.</p>\n    </div>\n    ` : `\n    <div class="card">\n      <h3>Internal Controls — Authorized Actors</h3>\n      <p style="font-size:12.5px;color:#6B7280;margin:0 0 14px;">Names available to pick from "Acting As" in the sidebar. This is self-attested, not a login — anyone with access to this dashboard could still pick any name — but it stamps every Activity Log entry with who was acting (tamper-evident, same hash chain as the rest of the log), and it lets joint-consent confirmation (Article 20(B)) enforce that the person confirming isn't the same person who created the transaction. That enforcement only works if the two Managing Partners actually pick their own name rather than sharing one.</p>\n      ${state.settings.authorizedActors.length ? `<table>\n        <thead><tr><th>Name</th><th></th></tr></thead>\n        <tbody>${state.settings.authorizedActors.map(name => `<tr><td>${esc(name)}</td><td style="white-space:nowrap;"><button class="btn-outline" onclick="removeAuthorizedActor('${esc(name)}')">Remove</button></td></tr>`).join("")}</tbody>\n      </table>` : `<p class="empty">No names configured yet — the "Acting As" selector stays hidden until at least one is added.</p>`}\n      <div class="form-row" style="margin-top:14px;">\n        <div class="form-group" style="flex:1;"><label>Add Name</label><input id="f-new-actor" placeholder="e.g. Managing Partner's name" /></div>\n      </div>\n      <button class="btn btn-gold" onclick="addAuthorizedActor(document.getElementById('f-new-actor').value)">+ Add</button>\n    </div>\n    `}\n    <div class="card">\n      <h3>Service Categories &amp; Rate Card</h3>\n      <p style="font-size:12.5px;color:#6B7280;margin:0 0 14px;">Schedule B categories and their suggested day rates by jurisdiction and tier.</p>\n      <table>\n        <thead><tr><th>Category</th><th></th></tr></thead>\n        <tbody>${Object.entries(cats).map(([key, cat]) => `<tr>\n          <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${cat.color};margin-right:6px;"></span>${esc(cat.label)}</td>\n          <td style="white-space:nowrap;"><button class="btn-outline" onclick="openRateCardModal('${key}')">Edit Rates</button><button class="btn-outline" onclick="deleteServiceCategory('${key}')">Delete</button></td>\n        </tr>`).join("")}</tbody>\n      </table>\n      <button class="btn btn-gold" style="margin-top:14px;" onclick="openNewCategoryModal()">+ New Category</button>\n    </div>\n    <div class="card">\n      <h3>Budgets</h3>\n      <p style="font-size:12.5px;color:#6B7280;margin:0 0 14px;">Annual budget per expense category — category must match an Expense category exactly (case-sensitive) to show up in the Budget vs. Actual report.</p>\n      ${state.budgets.length ? `<table>\n        <thead><tr><th>Category</th><th>Year</th><th>Budget</th><th></th></tr></thead>\n        <tbody>${[ ...state.budgets ].sort((a, b) => b.year - a.year || a.category.localeCompare(b.category)).map(b => `<tr>\n          <td>${esc(b.category)}</td><td>${esc(b.year)}</td><td class="right">${fmt(b.amount, b.currency)}</td>\n          <td style="white-space:nowrap;"><button class="btn-outline" onclick="openBudgetModal('${b.id}')">Edit</button><button class="btn-outline" onclick="deleteBudget('${b.id}')">Delete</button></td>\n        </tr>`).join("")}</tbody>\n      </table>` : '<p class="empty">No budgets set yet.</p>'}\n      <button class="btn btn-gold" style="margin-top:14px;" onclick="openBudgetModal()">+ New Budget</button>\n    </div>\n  `;
}
